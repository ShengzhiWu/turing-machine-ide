<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <title>Rendering…</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 12px;
            background: hsl(0,0%,8%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            overflow: auto;
        }
        #status {
            font-family: system-ui, sans-serif;
            font-size: 12px;
            color: rgba(255,255,255,0.55);
            align-self: flex-start;
        }
        #preview-canvas {
            border: 1px solid hsl(0,0%,25%);
            max-width: 100%;
        }
    </style>
</head>
<body>
    <span id="status"></span>
    <canvas id="preview-canvas"></canvas>

    <script>
        const { ipcRenderer } = require('electron');

        const canvas = document.getElementById('preview-canvas');
        const ctx    = canvas.getContext('2d');
        const status = document.getElementById('status');

        ipcRenderer.on('render-preview-init', (e, data) => {
            const s = data.strings || {};
            status.textContent = s.renderRendering || 'Rendering…';
            canvas.width  = data.width;
            canvas.height = data.height;
            const maxW = window.innerWidth  - 24;
            const maxH = window.innerHeight - 60;
            const scale = Math.min(1, maxW / data.width, maxH / data.height);
            canvas.style.width  = Math.round(data.width  * scale) + 'px';
            canvas.style.height = Math.round(data.height * scale) + 'px';
        });

        // Receive a JPEG dataURL — decode via Image and draw onto canvas
        const _img = new Image();
        _img.onload = () => ctx.drawImage(_img, 0, 0);
        ipcRenderer.on('render-preview-dataurl', (e, dataurl) => {
            _img.src = dataurl;
        });

        ipcRenderer.on('render-preview-status', (e, text) => {
            status.textContent = text;
            document.title = text;
        });
    </script>
</body>
</html>

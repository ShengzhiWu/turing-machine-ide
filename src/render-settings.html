<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px 24px 20px 24px;
            background: hsl(224, 17%, 18%);
            color: rgba(255,255,255,0.88);
            font-family: system-ui, sans-serif;
            font-size: 13px;
            line-height: 1.6;
            user-select: none;
            overflow-y: auto;
            overflow-x: hidden;
        }
        h2 { margin: 0 0 14px 0; font-size: 15px; font-weight: 600; color: white; }
        .section-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
            color: rgba(255,255,255,0.45); margin: 14px 0 6px 0;
        }
        .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
        .row label { width: 170px; flex-shrink: 0; color: rgba(255,255,255,0.75); }
        input[type=number] {
            background: hsl(224,17%,12%); border: 1px solid hsl(0,0%,38%);
            border-radius: 4px; color: white; padding: 3px 7px; font-size: 13px; width: 80px;
        }
        input[type=text] {
            background: hsl(224,17%,12%); border: 1px solid hsl(0,0%,38%);
            border-radius: 4px; color: white; padding: 3px 7px; font-size: 13px;
            flex: 1; width: auto;
        }
        select {
            background: hsl(224,17%,12%); border: 1px solid hsl(0,0%,38%);
            border-radius: 4px; color: white; padding: 3px 7px; font-size: 13px;
        }
        .note-input { width: 52px; flex: none; }
        input[type=checkbox] { width:14px; height:14px; cursor:pointer; accent-color:hsl(210,60%,55%); }
        input:focus, select:focus { outline:1px solid hsl(210,60%,55%); border-color:hsl(210,60%,55%); }
        .btn {
            padding: 5px 16px; background: hsl(210,60%,40%); color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .btn:hover { background: hsl(210,60%,52%); }
        .btn:disabled { background: hsl(0,0%,35%); cursor: default; opacity: 0.6; }
        .btn-small { padding: 3px 10px; font-size: 12px; }
        #progress-row { display:flex; align-items:center; gap:10px; margin-top:14px; }
        #progress-bar-wrap { flex:1; height:8px; background:hsl(0,0%,28%); border-radius:4px; overflow:hidden; }
        #progress-bar { height:100%; width:0%; background:hsl(210,60%,55%); border-radius:4px; transition:width 0.1s; }
        #frame-counter { font-size:12px; color:rgba(255,255,255,0.6); white-space:nowrap; min-width:70px; text-align:right; }
        .subsection-disabled { opacity:0.38; pointer-events:none; }
        .section-sep { border: none; border-top: 1px solid hsl(0,0%,28%); margin: 12px 0 0 0; }
    </style>
</head>
<body>
    <div class="section-title" id="sec-size">Size</div>
    <div class="row">
        <label id="lbl-width">Width</label>
        <input id="width" type="number" value="1920" min="128" max="7680">
        <label id="lbl-height" style="width:auto;padding-left:8px;">Height</label>
        <input id="height" type="number" value="1080" min="72" max="4320">
    </div>

    <hr class="section-sep">
    <div class="section-title" id="sec-timing">Timing</div>
    <div class="row">
        <label id="lbl-fps">Frame rate (fps)</label>
        <input id="fps" type="number" value="30" min="1" max="120">
    </div>
    <div class="row">
        <label id="lbl-move-frames">Move frames</label>
        <input id="move-frames" type="number" value="10" min="1" max="200">
    </div>
    <div class="row">
        <label id="lbl-pause-frames">Pause frames</label>
        <input id="pause-frames" type="number" value="5" min="0" max="200">
    </div>
    <div class="row">
        <label id="lbl-halflife">Highlight half-life (frames)</label>
        <input id="halflife" type="number" value="10" min="1" max="500">
    </div>
    <div class="row">
        <label id="lbl-speed-multiplier">Speed</label>
        <input id="speed-multiplier" type="number" value="1" min="1" max="1000000">
    </div>
    <div class="row">
        <label id="lbl-min-tail-continuation">Minimum tail continuation frames</label>
        <input id="min-tail-continuation" type="number" value="90" min="0" max="1000000">
    </div>
    <div class="row" style="margin-top:4px;margin-bottom:0">
        <label id="lbl-total-frames" style="color:rgba(255,255,255,0.45);font-size:12px;width:auto;"></label>
    </div>

    <hr class="section-sep">
    <div class="section-title" id="sec-style">Visual Style</div>
    <div class="row">
        <label id="lbl-render-image">Render image frames</label>
        <input id="render-image" type="checkbox" checked>
    </div>
    <div id="image-options">
        <div class="row">
            <label id="lbl-graphic-scale">Graphic scale</label>
            <input id="graphic-scale" type="number" value="1.0" min="0.1" max="10" step="0.1">
        </div>
        <div class="row" style="margin-top:6px;gap:40px;">
            <label style="display:flex;align-items:center;gap:6px;width:auto;cursor:pointer;">
                <input type="radio" name="movement-mode" id="movement-mode-tape" value="tape" checked
                       style="width:14px;height:14px;cursor:pointer;accent-color:hsl(210,60%,55%);">
                <span id="lbl-movement-mode-tape">Tape moves, head fixed</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;width:auto;cursor:pointer;">
                <input type="radio" name="movement-mode" id="movement-mode-head" value="head"
                       style="width:14px;height:14px;cursor:pointer;accent-color:hsl(210,60%,55%);">
                <span id="lbl-movement-mode-head">Head moves, tape fixed</span>
            </label>
        </div>
        <div id="head-tape-wrap-options">
            <div class="row" style="margin-top:8px;">
                <label style="display:flex;align-items:center;gap:6px;width:auto;cursor:pointer;">
                    <input type="checkbox" id="tape-wrap-lines" checked
                           style="width:14px;height:14px;cursor:pointer;accent-color:hsl(210,60%,55%);">
                    <span id="lbl-tape-wrap-lines">Wrap tape to multiple rows</span>
                </label>
            </div>
            <div id="max-cells-per-row-wrap">
                <div class="row">
                    <label id="lbl-max-cells-per-row" for="max-cells-per-row">Max cells per row</label>
                    <input id="max-cells-per-row" type="number" value="50" min="1" max="100000">
                </div>
            </div>
        </div>
    </div>

    <hr class="section-sep">
    <div class="section-title" id="sec-music">Music</div>
    <div class="row">
        <label id="lbl-render-music">Export audio</label>
        <input id="render-music" type="checkbox">
    </div>
    <div id="music-options" class="subsection-disabled">
        <div class="row">
            <label id="lbl-music-mode">Scale</label>
            <select id="music-mode">
                <option value="major">Major</option>
                <option value="minor">Minor (natural)</option>
            </select>
        </div>
        <div class="row">
            <label id="lbl-music-root">Root note</label>
            <input id="music-root" type="text" class="note-input" value="C4" placeholder="C4">
        </div>
        <div class="row">
            <label id="lbl-music-lo">Low note (range)</label>
            <input id="music-lo" type="text" class="note-input" value="C3" placeholder="C3">
        </div>
        <div class="row">
            <label id="lbl-music-hi">High note (range)</label>
            <input id="music-hi" type="text" class="note-input" value="C6" placeholder="C6">
        </div>
        <div class="row">
            <label id="lbl-music-seed">Random seed</label>
            <input id="music-seed" type="number" value="0" min="0" style="width:80px;">
        </div>
        <div class="row">
            <label id="lbl-music-samples">Piano samples folder</label>
            <input id="music-samples" type="text" placeholder="(leave blank to use synth)">
            <button class="btn btn-small" id="music-browse-btn">Browse</button>
        </div>
        <div class="row" style="margin-top:2px;">
            <label></label>
            <button class="btn btn-small" id="music-preview-btn">▶ Preview</button>
            <span id="music-preview-status" style="font-size:12px;color:rgba(255,255,255,0.45);margin-left:8px;"></span>
        </div>
    </div>

    <hr class="section-sep">
    <div class="section-title" id="sec-output">Output path</div>
    <div class="row">
        <input id="output-path" type="text" placeholder="">
        <button class="btn" id="browse-btn">Browse</button>
    </div>

    <div id="progress-row">
        <button class="btn" id="start-btn">Render</button>
        <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
        <span id="frame-counter">0 / 0</span>
    </div>

<script>
const { ipcRenderer } = require('electron');

let _s = {};  // 当前语言字符串，render-settings-init 时填充

ipcRenderer.on('render-settings-init', (e, data) => {
    _s = data.strings || {};
    const s = _s;
    const setText = (id, key, fb) => { const el = document.getElementById(id); if (el) el.textContent = s[key] || fb; };
    setText('sec-size',          'secSize',         'Size');
    setText('sec-timing',        'secTiming',       'Timing');
    setText('sec-style',         'secStyle',        'Visual Style');
    setText('sec-music',         'secMusic',        'Music');
    setText('sec-output',        'secOutput',       'Output path');
    setText('lbl-fps',           'lblFps',          'Frame rate (fps)');
    setText('lbl-width',         'lblWidth',        'Width');
    setText('lbl-height',        'lblHeight',       'Height');
    setText('lbl-move-frames',   'lblMoveFrames',   'Move frames');
    setText('lbl-pause-frames',  'lblPauseFrames',  'Pause frames');
    setText('lbl-speed-multiplier', 'lblSpeedMultiplier', 'Speed');
    setText('lbl-halflife',      'lblHalflife',     'Highlight half-life (frames)');
    setText('lbl-min-tail-continuation', 'lblMinTailContinuation', 'Minimum tail continuation frames');
    setText('lbl-render-image',  'lblRenderImage',  'Render image frames');
    setText('lbl-graphic-scale', 'lblGraphicScale', 'Graphic scale');
    setText('lbl-movement-mode-tape',  'renderMovementModeTape',  'Tape moves, head fixed');
    setText('lbl-movement-mode-head',  'renderMovementModeHead',  'Head moves, tape fixed');
    setText('lbl-tape-wrap-lines',     'lblTapeWrapLines',        'Wrap tape to multiple rows');
    setText('lbl-max-cells-per-row',   'lblMaxCellsPerRow',       'Max cells per row');
    setText('lbl-render-music',  'lblRenderMusic',  'Export audio');
    setText('lbl-music-mode',    'lblMusicMode',    'Scale');
    setText('lbl-music-root',    'lblMusicRoot',    'Root note');
    setText('lbl-music-lo',      'lblMusicLo',      'Low note (range)');
    setText('lbl-music-hi',      'lblMusicHi',      'High note (range)');
    setText('lbl-music-seed',    'lblMusicSeed',    'Random seed');
    setText('lbl-music-samples', 'lblMusicSamples', 'Piano samples folder');
    setText('music-preview-btn', 'btnMusicPreview', '▶ Preview');
    setText('start-btn',         'btnStart',        'Render');
    document.getElementById('output-path').placeholder   = s.outputPlaceholder       || '';
    document.getElementById('music-samples').placeholder = s.musicSamplesPlaceholder || '(leave blank to use synth)';
    const browseLabel = s.btnBrowse || 'Browse';
    document.getElementById('browse-btn').textContent = browseLabel;
    document.getElementById('music-browse-btn').textContent = browseLabel;
    // 音阶选项文字
    const modeEl = document.getElementById('music-mode');
    modeEl.options[0].textContent = s.renderMusicModeMajor || 'Major';
    modeEl.options[1].textContent = s.renderMusicModeMinor || 'Minor (natural)';
    // 窗口 OS 标题
    document.title = s.renderSettingsTitle || 'Render Settings';

    const p = data.params || {};
    const set = (id, val) => { if (val !== undefined && val !== null) document.getElementById(id).value = val; };
    set('width',         p.width);
    set('height',        p.height);
    set('fps',           p.fps);
    set('move-frames',   p.moveFrames);
    set('pause-frames',  p.pauseFrames);
    set('speed-multiplier', p.speedMultiplier);
    set('halflife',      p.halflife);
    if (p.minTailContinuationFrames !== undefined && p.minTailContinuationFrames !== null)
        set('min-tail-continuation', p.minTailContinuationFrames);
    set('graphic-scale', p.graphicScale);
    if (p.movementMode) {
        const modeEl = document.querySelector(`input[name="movement-mode"][value="${p.movementMode}"]`);
        if (modeEl) modeEl.checked = true;
    }
    set('music-mode',    p.musicMode);
    set('music-root',    p.musicRoot);
    set('music-lo',      p.musicLoNote);
    set('music-hi',      p.musicHiNote);
    set('music-seed',    p.musicSeed);
    set('music-samples', p.samplesDir);
    if (p.outputPath) document.getElementById('output-path').value = p.outputPath;
    if (p.renderImage !== undefined) document.getElementById('render-image').checked = !!p.renderImage;
    if (p.renderMusic !== undefined) document.getElementById('render-music').checked = !!p.renderMusic;
    if (p.tapeWrapLines !== undefined) document.getElementById('tape-wrap-lines').checked = !!p.tapeWrapLines;
    if (p.maxCellsPerRow !== undefined) document.getElementById('max-cells-per-row').value = p.maxCellsPerRow;
    updateSubsections();
    updateHeadTapeWrapOptions();
    updateTotalFrames(data.totalFrames || 0);
});

ipcRenderer.on('render-progress', (e, data) => {
    document.getElementById('progress-bar').style.width = data.pct + '%';
    document.getElementById('frame-counter').textContent = data.current + ' / ' + data.total;
});
ipcRenderer.on('render-total-frames', (e, n) => updateTotalFrames(n));

function updateTotalFrames(n) {
    const prefix = _s.lblTotalFrames || 'Total frames: ';
    if (n <= 0) { document.getElementById('lbl-total-frames').textContent = ''; return; }
    const fps = Math.max(1, parseInt(document.getElementById('fps').value) || 30);
    const totalSec = Math.round(n / fps);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    let dur = '';
    if (h > 0) dur += h + (_s.durationHour   || 'h') + ' ';
    if (h > 0 || m > 0) dur += m + (_s.durationMinute || 'm') + ' ';
    dur += s + (_s.durationSecond || 's');
    document.getElementById('lbl-total-frames').textContent = prefix + n + '\u2003\u2003' + (_s.lblTotalDuration || 'Duration: ') + dur.trim();
}

function getParams() {  // 获取渲染设置，用于保存
    let pauseFrames = parseInt(document.getElementById('pause-frames').value);
    if (pauseFrames === undefined)
        pauseFrames = 5;
    return {
        width:        Math.max(1,   parseInt(document.getElementById('width').value)          || 1920),
        height:       Math.max(1,   parseInt(document.getElementById('height').value)         || 1080),
        fps:          Math.max(1,   parseInt(document.getElementById('fps').value)            || 30),
        moveFrames:   Math.max(1,   parseInt(document.getElementById('move-frames').value)    || 10),
        pauseFrames:  Math.max(0,   pauseFrames),  // pauseFrames 可以为 0
        speedMultiplier: Math.max(1, parseInt(document.getElementById('speed-multiplier').value, 10) || 1),
        halflife:     Math.max(1,   parseInt(document.getElementById('halflife').value)       || 10),
        minTailContinuationFrames: (() => {
            const raw = document.getElementById('min-tail-continuation').value.trim();
            const v = parseInt(raw, 10);
            return Number.isFinite(v) && v >= 0 ? v : 90;
        })(),
        graphicScale: Math.max(0.1, parseFloat(document.getElementById('graphic-scale').value) || 1.0),
        movementMode: document.querySelector('input[name="movement-mode"]:checked')?.value || 'tape',
        tapeWrapLines: document.getElementById('tape-wrap-lines').checked,
        maxCellsPerRow: Math.max(1, parseInt(document.getElementById('max-cells-per-row').value, 10) || 50),
        renderImage:  document.getElementById('render-image').checked,
        renderMusic:  document.getElementById('render-music').checked,
        musicMode:    document.getElementById('music-mode').value,
        musicRoot:    document.getElementById('music-root').value.trim()  || 'C4',
        musicLoNote:  document.getElementById('music-lo').value.trim()    || 'C3',
        musicHiNote:  document.getElementById('music-hi').value.trim()    || 'C6',
        musicSeed:    parseInt(document.getElementById('music-seed').value) || 0,
        samplesDir:   document.getElementById('music-samples').value.trim(),
        outputPath:   document.getElementById('output-path').value.trim(),
    };
}

['width','height','fps','move-frames','pause-frames','halflife','speed-multiplier','min-tail-continuation','graphic-scale',
 'render-image','render-music','music-mode','music-root','music-lo','music-hi',
 'music-seed','music-samples','output-path','movement-mode-tape','movement-mode-head',
 'max-cells-per-row'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input',  () => ipcRenderer.send('render-params-changed', getParams()));
    el.addEventListener('change', () => ipcRenderer.send('render-params-changed', getParams()));
});
['movement-mode-tape', 'movement-mode-head'].forEach(id => {
    document.getElementById(id).addEventListener('change', updateHeadTapeWrapOptions);
});

function updateSubsections() {
    document.getElementById('music-options').classList.toggle(
        'subsection-disabled', !document.getElementById('render-music').checked);
    document.getElementById('image-options').classList.toggle(
        'subsection-disabled', !document.getElementById('render-image').checked);
    updateHeadTapeWrapOptions();
}

/** 仅「渲染图像 + 纸带固定机头动」时显示分行选项；动纸带模式下隐藏 */
function updateHeadTapeWrapOptions() {
    const wrapBlock = document.getElementById('head-tape-wrap-options');
    const imgOn = document.getElementById('render-image').checked;
    const headMode = document.getElementById('movement-mode-head').checked;
    const show = imgOn && headMode;
    wrapBlock.style.display = show ? '' : 'none';
    const maxCellsWrap = document.getElementById('max-cells-per-row-wrap');
    const wrapCb = document.getElementById('tape-wrap-lines');
    // 与「音乐」未启用时一致：用 subsection-disabled 降低透明度并禁止指针，不用 input.disabled
    maxCellsWrap.classList.toggle('subsection-disabled', !wrapCb.checked);
}
document.getElementById('render-music').addEventListener('change', updateSubsections);
document.getElementById('render-image').addEventListener('change', updateSubsections);
document.getElementById('tape-wrap-lines').addEventListener('change', () => {
    updateHeadTapeWrapOptions();
    ipcRenderer.send('render-params-changed', getParams());
});

document.getElementById('browse-btn').addEventListener('click', async () => {
    const r = await ipcRenderer.invoke('show-open-dialog', { title: _s.browseTitle || 'Select Output Folder', properties: ['openDirectory'] });
    if (r && !r.canceled && r.filePaths.length > 0) {
        document.getElementById('output-path').value = r.filePaths[0];
        ipcRenderer.send('render-params-changed', getParams());
    }
});

document.getElementById('music-browse-btn').addEventListener('click', async () => {
    const r = await ipcRenderer.invoke('show-open-dialog', { title: _s.musicBrowseTitle || 'Select Piano Samples Folder', properties: ['openDirectory'] });
    if (r && !r.canceled && r.filePaths.length > 0) {
        document.getElementById('music-samples').value = r.filePaths[0];
        ipcRenderer.send('render-params-changed', getParams());
    }
});

// ── Audio preview ─────────────────────────────────────────────────────────────
document.getElementById('music-preview-btn').addEventListener('click', () => {
    document.getElementById('music-preview-status').textContent = _s.musicBaking || 'Baking…';
    document.getElementById('music-preview-btn').disabled = true;
    ipcRenderer.send('render-music-preview', getParams());
});

ipcRenderer.on('render-music-preview-ready', (e, data) => {
    document.getElementById('music-preview-btn').disabled = false;
    const statusEl = document.getElementById('music-preview-status');
    if (data.error) { statusEl.textContent = 'Error: ' + data.error; return; }
    statusEl.textContent = _s.musicPlaying || 'Playing…';
    const arrayBuf = Buffer.from(data.wavBase64, 'base64').buffer;
    const actx = new AudioContext();
    actx.decodeAudioData(arrayBuf, decoded => {
        const src = actx.createBufferSource();
        src.buffer = decoded;
        src.connect(actx.destination);
        src.start();
        src.onended = () => { statusEl.textContent = ''; actx.close(); };
    }, () => { statusEl.textContent = _s.musicDecodeError || 'Decode error'; });
});

document.getElementById('start-btn').addEventListener('click', () => {
    const params = getParams();
    if (!params.outputPath) { alert(_s.alertNoOutput || 'Please choose an output folder.'); return; }
    if (!params.renderImage && !params.renderMusic) {
        alert(_s.alertNothingEnabled || 'Please enable at least one of: Render image frames or Export audio.'); return;
    }
    ipcRenderer.send('render-start', params);
});

ipcRenderer.on('render-ui-lock', (e, locked) => {
    document.querySelectorAll('input, button, select').forEach(el => el.disabled = locked);
    document.getElementById('start-btn').disabled = locked;
});
</script>
</body>
</html>

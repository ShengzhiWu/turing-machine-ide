<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <title>Render Animation</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px 24px 20px 24px;
            background: hsl(224, 17%, 18%);
            color: rgba(255,255,255,0.88);
            font-family: system-ui, sans-serif;
            font-size: 13px;
            line-height: 1.6;
            user-select: none;
            overflow: hidden;
        }
        h2 {
            margin: 0 0 14px 0;
            font-size: 15px;
            font-weight: 600;
            color: white;
        }
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.45);
            margin: 14px 0 6px 0;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px;
        }
        .row label {
            width: 160px;
            flex-shrink: 0;
            color: rgba(255,255,255,0.75);
        }
        input[type=number], input[type=text] {
            background: hsl(224,17%,12%);
            border: 1px solid hsl(0,0%,38%);
            border-radius: 4px;
            color: white;
            padding: 3px 7px;
            font-size: 13px;
            width: 80px;
        }
        input[type=text] { flex: 1; width: auto; }
        input:focus { outline: 1px solid hsl(210,60%,55%); border-color: hsl(210,60%,55%); }
        .btn {
            padding: 5px 16px;
            background: hsl(210,60%,40%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { background: hsl(210,60%,52%); }
        .btn:disabled { background: hsl(0,0%,35%); cursor: default; opacity: 0.6; }
        #progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
        }
        #progress-bar-wrap {
            flex: 1;
            height: 8px;
            background: hsl(0,0%,28%);
            border-radius: 4px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: hsl(210,60%,55%);
            border-radius: 4px;
            transition: width 0.1s;
        }
        #frame-counter {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
            min-width: 70px;
            text-align: right;
        }
        #bottom-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2 id="title">Render Animation</h2>

    <div class="section-title" id="sec-size">Size</div>
    <div class="row">
        <label id="lbl-width">Width</label>
        <input id="width" type="number" value="1920" min="128" max="7680">
        <label id="lbl-height" style="width:auto; padding-left:8px;">Height</label>
        <input id="height" type="number" value="1080" min="72" max="4320">
    </div>

    <div class="section-title" id="sec-timing">Timing</div>
    <div class="row">
        <label id="lbl-move-frames">Move frames</label>
        <input id="move-frames" type="number" value="10" min="1" max="200">
    </div>
    <div class="row">
        <label id="lbl-pause-frames">Pause frames</label>
        <input id="pause-frames" type="number" value="5" min="0" max="200">
    </div>
    <div class="row">
        <label id="lbl-halflife">Highlight half-life (frames)</label>
        <input id="halflife" type="number" value="10" min="1" max="500">
    </div>
    <div class="row" style="margin-top:4px; margin-bottom:0">
        <label id="lbl-total-frames" style="color:rgba(255,255,255,0.45); font-size:12px; width:auto;"></label>
    </div>

    <div class="section-title" id="sec-style">Visual Style</div>
    <div class="row">
        <label id="lbl-graphic-scale">Graphic scale</label>
        <input id="graphic-scale" type="number" value="1.0" min="0.1" max="10" step="0.1">
    </div>

    <div class="section-title" id="sec-output">Output path</div>
    <div class="row">
        <input id="output-path" type="text" placeholder="">
        <button class="btn" id="browse-btn">…</button>
    </div>

    <div id="progress-row">
        <button class="btn" id="start-btn">Render</button>
        <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
        <span id="frame-counter">0 / 0</span>
    </div>

    <div id="bottom-row">
        <button class="btn" id="close-btn">Close</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // ── Receive initial data from main window ─────────────────────
        ipcRenderer.on('render-settings-init', (e, data) => {
            // Apply localised strings
            const s = data.strings;
            if (s) {
                document.getElementById('title').textContent           = s.title        || 'Render Animation';
                document.getElementById('sec-size').textContent        = s.secSize      || 'Size';
                document.getElementById('sec-timing').textContent      = s.secTiming    || 'Timing';
                document.getElementById('sec-style').textContent       = s.secStyle     || 'Visual Style';
                document.getElementById('sec-output').textContent      = s.secOutput    || 'Output path';
                document.getElementById('lbl-width').textContent       = s.lblWidth     || 'Width';
                document.getElementById('lbl-height').textContent      = s.lblHeight    || 'Height';
                document.getElementById('lbl-move-frames').textContent = s.lblMoveFrames  || 'Move frames';
                document.getElementById('lbl-pause-frames').textContent= s.lblPauseFrames || 'Pause frames';
                document.getElementById('lbl-halflife').textContent    = s.lblHalflife  || 'Highlight half-life (frames)';
                document.getElementById('lbl-graphic-scale').textContent = s.lblGraphicScale || 'Graphic scale';
                document.getElementById('start-btn').textContent       = s.btnStart     || 'Render';
                document.getElementById('close-btn').textContent       = s.btnClose     || 'Close';
                document.getElementById('output-path').placeholder     = s.outputPlaceholder || '';
                document.getElementById('browse-btn').textContent      = s.btnBrowse    || '…';
            }
            // Restore previous param values if provided
            const params = data.params;
            if (params) {
                document.getElementById('width').value         = params.width;
                document.getElementById('height').value        = params.height;
                document.getElementById('move-frames').value   = params.moveFrames;
                document.getElementById('pause-frames').value  = params.pauseFrames;
                document.getElementById('halflife').value      = params.halflife;
                document.getElementById('graphic-scale').value = params.graphicScale;
                if (params.outputPath) document.getElementById('output-path').value = params.outputPath;
            }
            updateTotalFrames(data.totalFrames || 0);
        });

        // ── Receive progress updates during render ────────────────────
        ipcRenderer.on('render-progress', (e, data) => {
            document.getElementById('progress-bar').style.width = data.pct + '%';
            document.getElementById('frame-counter').textContent = data.current + ' / ' + data.total;
        });

        // ── Receive total-frames updates when params change ───────────
        ipcRenderer.on('render-total-frames', (e, n) => {
            updateTotalFrames(n);
        });

        function updateTotalFrames(n) {
            const lbl = document.getElementById('lbl-total-frames');
            lbl.textContent = (n > 0 ? n + ' frames total' : '');
        }

        // ── Notify main window when params change ─────────────────────
        function getParams() {
            return {
                width:        Math.max(1,   parseInt(document.getElementById('width').value)         || 1920),
                height:       Math.max(1,   parseInt(document.getElementById('height').value)        || 1080),
                moveFrames:   Math.max(1,   parseInt(document.getElementById('move-frames').value)   || 10),
                pauseFrames:  Math.max(0,   parseInt(document.getElementById('pause-frames').value)  || 5),
                halflife:     Math.max(1,   parseInt(document.getElementById('halflife').value)      || 10),
                graphicScale: Math.max(0.1, parseFloat(document.getElementById('graphic-scale').value) || 1.0),
                outputPath:   document.getElementById('output-path').value.trim(),
            };
        }

        ['width','height','move-frames','pause-frames','halflife','graphic-scale'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                ipcRenderer.send('render-params-changed', getParams());
            });
        });

        // ── Browse ────────────────────────────────────────────────────
        document.getElementById('browse-btn').addEventListener('click', async () => {
            const result = await ipcRenderer.invoke('show-open-dialog', {
                title: 'Select Output Folder',
                properties: ['openDirectory']
            });
            if (result && !result.canceled && result.filePaths.length > 0) {
                document.getElementById('output-path').value = result.filePaths[0];
                ipcRenderer.send('render-params-changed', getParams());
            }
        });

        // ── Start render ──────────────────────────────────────────────
        document.getElementById('start-btn').addEventListener('click', () => {
            const params = getParams();
            if (!params.outputPath) {
                alert(document.getElementById('output-path').placeholder || 'Please choose an output folder.');
                return;
            }
            ipcRenderer.send('render-start', params);
        });

        // ── Close ─────────────────────────────────────────────────────
        document.getElementById('close-btn').addEventListener('click', () => {
            ipcRenderer.send('render-settings-close');
        });

        // ── Disable/enable UI during render ───────────────────────────
        ipcRenderer.on('render-ui-lock', (e, locked) => {
            const inputs = document.querySelectorAll('input, button');
            inputs.forEach(el => {
                if (el.id === 'close-btn' || el.id === 'start-btn') return; // controlled separately
                el.disabled = locked;
            });
            document.getElementById('start-btn').disabled = locked;
            document.getElementById('browse-btn').disabled = locked;
            // close button stays disabled while rendering
            document.getElementById('close-btn').disabled = locked;
        });
    </script>
</body>
</html>

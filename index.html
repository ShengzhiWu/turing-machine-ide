<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turing Machine IDE</title>
    <style>
        #refresh-btn {
            position: absolute;
            left: 0.5em;
            top: 0.5em;
            width: 2em;
            height: 2em;
            margin: 0; padding: 0;
            background-color: transparent;
            border: none;
            border-radius: 50%;  /* Round */
            cursor: pointer;
        }

        .glow-icon {
            width: 2em;
            height: 2em;
            fill: none;
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        #refresh-btn:hover .glow-icon {
            stroke: white;  /* White stroke */
        }

        #refresh-btn:active .glow-icon {
            stroke: white;  /* White stroke */
            filter: drop-shadow(0 0 4px rgba(255,255,255,1));  /* Glow */
        }

        #run-btn {
            height: 3em;
            margin-left: 20%; margin-right: 20%;
            border-radius: 1.5em; border: none;
            background-color: rgb(63, 138, 63);
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        #run-btn:hover {
            background-color: rgb(97, 170, 97);
        }
         
        td {width:1.5em;}

        /* ── Menu Bar ── */
        #menu-bar {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            height: 28px;
            background: linear-gradient(to right, hsl(222, 25%, 21%), hsl(0, 0%, 75%));
            color: rgba(255,255,255,0.85);
            font-size: 13px;
            font-family: system-ui, sans-serif;
            user-select: none;
            flex-shrink: 0;
            z-index: 1000;
            position: relative;
        }

        .menu-item {
            position: relative;
            padding: 0 14px;
            display: flex;
            align-items: center;
            cursor: default;
            white-space: nowrap;
        }

        .menu-item:hover,
        .menu-item.active {
            background-color: hsl(210, 60%, 40%);
            color: white;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 200px;
            background-color: hsl(224, 17%, 22%);
            border: 1px solid hsl(0, 0%, 35%);
            box-shadow: 2px 4px 12px rgba(0,0,0,0.5);
            z-index: 1001;
            padding: 3px 0;
        }

        .menu-item.active .menu-dropdown {
            display: block;
        }

        .menu-dropdown-item {
            padding: 6px 18px;
            color: rgba(255,255,255,0.85);
            cursor: default;
            white-space: nowrap;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .menu-dropdown-item:hover {
            background-color: hsl(210, 60%, 40%);
            color: white;
        }

        .menu-dropdown-item.disabled {
            color: rgba(255,255,255,0.35);
            pointer-events: none;
        }

        .menu-dropdown-separator {
            border: none;
            border-top: 1px solid hsl(0, 0%, 35%);
            margin: 3px 0;
        }

        /* ── Submenu ── */
        .menu-dropdown-item.has-submenu {
            position: relative;
        }

        .menu-dropdown-item.has-submenu::after {
            content: '▶';
            font-size: 9px;
            opacity: 0.7;
            margin-left: auto;
            padding-left: 8px;
        }

        .menu-submenu {
            display: none;
            position: absolute;
            top: -3px;
            left: 100%;
            min-width: 140px;
            background-color: hsl(224, 17%, 22%);
            border: 1px solid hsl(0, 0%, 35%);
            box-shadow: 2px 4px 12px rgba(0,0,0,0.5);
            z-index: 1002;
            padding: 3px 0;
        }

        .menu-dropdown-item.has-submenu:hover > .menu-submenu {
            display: block;
        }

        .menu-submenu-item {
            padding: 6px 18px;
            color: rgba(255,255,255,0.85);
            cursor: default;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-submenu-item:hover {
            background-color: hsl(210, 60%, 40%);
            color: white;
        }

        .menu-submenu-item.has-submenu::after {
            content: '▶';
            font-size: 9px;
            opacity: 0.7;
            margin-left: auto;
            padding-left: 8px;
        }

        .menu-submenu-item.has-submenu:hover > .menu-submenu {
            display: block;
        }

        .menu-submenu-item .checkmark {
            width: 12px;
            display: inline-block;
            font-size: 11px;
        }

        /* ── Main content area ── */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            min-height: 0;
        }

        /* ── About Modal ── */
        #about-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        #about-overlay.visible {
            display: flex;
        }

        #about-dialog {
            background: hsl(0, 0%, 14%);
            color: rgba(255,255,255,0.88);
            border: 1px solid hsl(0,0%,35%);
            border-radius: 8px;
            padding: 28px 34px;
            min-width: 340px;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            font-family: system-ui, sans-serif;
            font-size: 13px;
            line-height: 1.7;
            position: relative;
        }

        #about-dialog h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        #about-dialog .about-version {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            margin-bottom: 16px;
        }

        #about-close-btn {
            margin-top: 20px;
            padding: 6px 22px;
            background: hsl(210, 60%, 40%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: block;
            margin-left: auto;
        }

        #about-close-btn:hover {
            background: hsl(210, 60%, 52%);
        }
    </style>
</head>

    <!-- 加载样例代码 -->
    <script src="src/examples/binary-division.js"></script>

    <script src="src/examples/copy-bricks.js"></script>

    <script>
        var language = 'zh';  // 默认语言，支持zh、en。如果设置了不支持的语言，将回退到en
        var example = 'binary-division';  // 默认样例
        var codeModified;   // 用户是否修改过图灵机代码
        var styleModified;  // 用户是否修改过样式代码
    </script>

    <script>
        const code_editor = document.querySelector('#code-editor');
        const style_editor = document.querySelector('#style-textarea');
        const graph_view = document.querySelector('#graph-view');
        const max_steps_input = document.querySelector('#max-steps-input');
        const history_table = document.querySelector('#history-table');

        // 紧凑格式（旧） -> 新格式
        // let codeNew = "";
        // for (const [key1, value1] of Object.entries(code)) {
        //     for (const [key2, value2] of Object.entries(value1[1])) {
        //         let newLine = [key1];
        //         newLine.push(`"${key2}"`);
        //         if (value2.length > 1)
        //             newLine.push(`"${value2[1]}"`);
        //         else
        //             newLine.push('N');
        //         const nextState = value2[0];
        //         if (code[nextState] == undefined)
        //             newLine.push('N');
        //         else
        //             newLine.push(code[nextState][0]);
        //         newLine.push(nextState);
        //         codeNew += newLine.join(", ") + "\n";
        //     }
        //     let newLine = [key1, 'other', 'N', value1[0]];
        //     codeNew += newLine.join(", ") + "\n\n";
        // }

        var code_editor_value = examples[example]['code'][language] || examples[example]['code']['en'];  // 代码编辑器中的文本
        code_editor.value = code_editor_value;  // 将代码编辑器的内容设置成指定内容
        setTimeout(() => {  // 不知道为什么要延时，不延时这个值会被初始自动发出的修改事件覆盖掉
            codeModified = false;  // 标记为未编辑过
        }, 10);
        code_editor.lang = language;  // 设置语言，可选项有zh和en
        style_editor.lang = language;  // 设置语言，可选项有zh和en

        const NOT_VALID = Symbol('not valid');
        const N = Symbol('N');
        const OTHER = Symbol('other');

        function parseProgramCode(code) { // 解析新格式代码
            const result = {};
            code.split("\n").forEach((rawLine, lineIndex) => {  // 遍历行
                // 去掉注释
                const trimmed = rawLine.split("//")[0].trim();

                if (trimmed.length == 0)
                    return;
                
                const parts = trimmed.split(",").map(part => part.trim());

                const state = parts[0];
                let input = parts[1];
                if (input == 'other')
                    input = OTHER;
                else {
                    if (input == undefined || !input.startsWith('"') || !input.endsWith('"'))
                        input = NOT_VALID;  // 无效值
                    else
                        input = input.slice(1, -1);  // 去掉引号
                }
                let output = parts[2];
                if (output == 'N')
                    output = N;
                else {
                    if (output == undefined || !output.startsWith('"') || !output.endsWith('"'))
                        output = NOT_VALID;  // 无效值
                    else
                        output = output.slice(1, -1);  // 去掉引号
                }
                let direction = parts[3];
                if (direction != 'L' && direction != 'R' && direction != 'N')
                    direction = NOT_VALID;
                let nextState = parts[4];
                if (nextState == undefined)
                    nextState = state;

                if (result[state] == undefined)
                    result[state] = {};
                // 存规则值，同时附带行号和去注释后的行内容，供图跳转使用
                result[state][input] = [output, direction, nextState, { lineIndex, lineContent: trimmed }];
            });

            return result;
        }

        function _splitTopLevel(str) {  // 根据逗号分割（无视括号中的逗号）
            const parts = [];
            let depth = 0, cur = '';
            for (const c of str) {
                if      (c === '(')           { depth++; cur += c; }
                else if (c === ')')           { depth--; cur += c; }
                else if (c === ',' && !depth) { parts.push(cur.trim()); cur = ''; }
                else                          { cur += c; }
            }
            if (cur.trim()) parts.push(cur.trim());
            return parts;
        }

        function parseStyleCode(code) {  // 解析风格代码
            // 创建一个临时元素
            const div = document.createElement('div');
            const result = {};
            code.split("\n").forEach(line => {  // 遍历行
                // 去掉注释
                line = line.split("//")[0].trim();

                if (line.length == 0)
                    return;
                
                // 根据逗号分割（无视括号中的逗号）
                const parts = _splitTopLevel(line);

                result[parts[0]] = {};

                div.style.color = '';
                div.style.color = parts[1];
                if (div.style.color !== '')
                    result[parts[0]]['foreground'] = parts[1];

                div.style.color = '';
                div.style.color = parts[2];
                if (div.style.color !== '')
                    result[parts[0]]['background'] = parts[2];
            });

            return result;
        }

        var code = parseProgramCode(code_editor_value);  // 解析代码文本

        style_editor.addEventListener('ready', () => {  // 风格编辑器初始化完成监听
            style_editor.value = examples[example]['style'][language] || examples[example]['style']['en'];  // 设置初始风格代码
            styleModified = false;  // 标记为未编辑过
        });

        var editing_line = 0;  // 代码编辑器中光标落在的行的行号
        var highlighted_vertex_name;  // 高亮的节点的名称
        var result_table_style;  // 结果表格的风格（每种符号的前景色、背景色）

        var global_size_factor = 0.5;
        var global_force_factor = 2.;
        var connection_default_length = 0.6*global_size_factor;  // 0.15
        var self_connection_default_length = 0.4*global_size_factor;  // 0.15
        var vertex_prefered_distance = 1.4*global_size_factor;  //0.8
        var vertex_repel_strength = 0.01*global_force_factor;  // 0.02
        var connection_length_preserve_strength = 0.01*global_force_factor;  // 0.02

        class RandomGenerator {
            constructor(seed) {
                this.seed = seed;
                this.multiplier = 1664525;
                this.increment = 1013904223;
                this.modulus = Math.pow(2, 32);
                this.state = seed;
            }

            next() {  // 0~1
                this.state = (this.state * this.multiplier + this.increment) % this.modulus;
                return this.state / this.modulus;
            }

            nextGaussion(quality=4) {  // Standard normal distribution
                result = 0.;
                for(var i=0;i<quality;i++)
                    result += this.next();
                return (result-quality*0.5)/Math.sqrt(quality/12.);
            }
        }

        function construct_directed_graph_with_code(code, seed=0) {  // 根据图灵机代码构建状态图
            const rng = new RandomGenerator(seed)
            const get_random_point = () => [rng.nextGaussion(), rng.nextGaussion()];
            var graph = [];
            for (const [state, action] of Object.entries(code)) {
                graph.push([
                    state,  // State
                    get_random_point(),  // Position
                    true,  // Visibility
                    []  // Connections: [target_vertex_index, edge_name, prefered_length, offset_for_multiple_edges]
                ]);  // Add every state as a node in graph
            }

            var i;
            Object.keys(code).forEach(state => {  // Traversal all states
                i = graph.findIndex(e => e[0] == state);
                const vertex = graph[i];
                for (let input of Reflect.ownKeys(code[state])) {  // Traversal all actions
                    let action = code[state][input];
                    if (input == NOT_VALID)
                        input = '*';
                    let [output, direction, nextState] = action;
                    if (output == NOT_VALID)
                        output = '*';
                    if (direction == NOT_VALID)
                        direction = '*';
                    const edge_name = (input == "" ? '""': (input == OTHER ? 'other': input)) + (output != N ? '→'+ (output == "" ? '""': output): "") + ', ' + direction;
                    if(nextState == state) {  // Connect to self
                        const scIndex = graph.filter(n => n[0].startsWith('self-connection')).length;
                        graph.push([`self-connection-${scIndex}`, get_random_point(), false, i]);  // Add the new node for displaying a self-connection
                        vertex[3].push([graph.length - 1, edge_name , self_connection_default_length, undefined]);  // Add a connection
                    }
                    else {  // Connection to another vertex
                        var j = graph.findIndex(e => e[0] == nextState);
                        if(j == -1) {  // This is a connection to a new node.
                            if (nextState == 'end')
                                nextState = "end_from_" + i;
                            if (nextState == 'error')
                                nextState = "error_from_" + i;
                            const newNode = [
                                nextState,
                                get_random_point(),
                                true,
                                []
                            ];  // Add the new node.
                            // 记录此节点对应的代码行信息（第四元 action[3] 由 parseProgramCode 附带）
                            if (action[3]) newNode._jumpInfo = action[3];
                            graph.push(newNode);
                            j = graph.length - 1;
                        }

                        // Calaulate offset for displaying multiple edges.
                        var offset = 0.5;
                        vertex[3].forEach(connection => {
                            if(connection[0] == j)  // Found multiple edge of same direction
                            {
                                offset = Math.min(offset, connection[3]);
                                connection[3] += 0.5;
                            }
                        });
                        const nextStateVertex = graph[j];
                        if(nextStateVertex[0].startsWith('self-connection'))
                            return;
                        nextStateVertex[3].forEach(connection => {
                            if(connection[0] == i) {  // Found multiple edge of opposite direction
                                offset = Math.min(offset, -connection[3]);
                                connection[3] -= 0.5;
                            }
                        });
                        offset -= 0.5;

                        vertex[3].push([j, edge_name, connection_default_length, offset]);
                    }
                    
                }
            });

            return graph;
        }

        // Display parameters
        var frame = {"x": 400, "y": 450, "factor": 200};  // Frame for visualization.
        var vertex_r = 7;  // 有向图节点显示半径(px)
        var arrow_head_length = 10;  // (px)
        var arrow_head_width = 7;  // (px)
        var self_connection_angle = 1.;
        var connection_text_offset = 10.;  // (px)
        var self_connection_text_distance_factor = 0.85;
        var vertex_name_text_offset = [8, 15];
        var multiple_edges_gap_angle = 1.2;
        var multiple_edges_shape_param1 = 0.3;
        var multiple_edges_shape_param2 = 50;  // (px)

        function vector_plus(u, v) {
            return [u[0] + v[0], u[1] + v[1]]
        }

        function vector_subtract(u, v) {
            return [u[0] - v[0], u[1] - v[1]]
        }

        function vector_length(v) {
            return Math.sqrt(v[0] * v[0] + v[1] * v[1]);
        }

        function vector_scale(k, v) {
            return [k * v[0], k * v[1]];
        }

        function vector_rotate(v, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return [v[0] * cos - v[1] * sin, v[0] * sin + v[1] * cos];
        }

        // ─── DOM 辅助 ────────────────────────────────────────────────
        const SVG_NS = "http://www.w3.org/2000/svg";
        function svgEl(tag, attrs) {
            const el = document.createElementNS(SVG_NS, tag);
            for (const [k, v] of Object.entries(attrs))
                el.setAttribute(k, v);
            return el;
        }

        // 更新箭头头部多边形的 points 属性（复用已有元素）
        function update_arrow_head_el(el, top, direction) {
            const root = vector_subtract(top, vector_scale(arrow_head_length, direction));
            el.setAttribute("points",
                (root[0] + direction[1]*arrow_head_width*0.5) + ',' + (root[1] - direction[0]*arrow_head_width*0.5) + ' '
                + top[0] + ',' + top[1] + ' '
                + (root[0] - direction[1]*arrow_head_width*0.5) + ',' + (root[1] + direction[0]*arrow_head_width*0.5));
        }

        // ─── 阶段一：构建 DOM 结构（仅在图结构改变时调用）──────────────
        function build_graph_dom(graph) {
            // 清空 graph_view，但保留已有的非图内容（无）
            while (graph_view.firstChild) graph_view.removeChild(graph_view.lastChild);

            // 连线层
            const conn_group = svgEl("g", {});
            graph_view.appendChild(conn_group);

            graph.forEach(node => {
                if (node[0].startsWith('self-connection')) return;
                node[3].forEach(connection => {
                    const target_node = graph[connection[0]];
                    const dom = {};  // 该 connection 对应的 DOM 元素引用

                    if (target_node[0].startsWith('self-connection')) {
                        dom.path = svgEl("path", {stroke:"black","stroke-width":"1",fill:"none"});
                        dom.arrow = svgEl("polygon", {fill:"black"});
                        dom.text  = svgEl("text",   {fill:"black",style:"font-size:12px"});
                        dom.text.textContent = connection[1];
                        conn_group.appendChild(dom.path);
                        conn_group.appendChild(dom.arrow);
                        conn_group.appendChild(dom.text);
                    } else {
                        dom.path = svgEl("path", {stroke:"black","stroke-width":"1",fill:"none"});
                        dom.arrow = svgEl("polygon", {fill:"black"});
                        dom.text  = svgEl("text",   {fill:"black",style:"font-size:12px"});
                        dom.text.textContent = connection[1];
                        conn_group.appendChild(dom.path);
                        conn_group.appendChild(dom.arrow);
                        conn_group.appendChild(dom.text);
                    }
                    connection._dom = dom;  // 将 DOM 引用挂在 connection 上
                });
            });

            // 节点层
            const vert_group = svgEl("g", {fill:"white"});
            graph_view.appendChild(vert_group);

            graph.forEach(node => {
                if (!node[2]) return;  // 不可见节点跳过

                let node_name = node[0];
                if (node_name.startsWith('end'))   node_name = 'end';
                else if (node_name.startsWith('error')) node_name = 'error';
                const color = (node_name==='start'||node_name==='end'||node_name==='error') ? 'yellow' : 'white';

                const dom = {};
                dom.circle = svgEl("circle", {r: vertex_r, fill: color, stroke:"black","stroke-width":"1"});
                // 高亮圆环（默认隐藏）
                dom.highlight = svgEl("circle", {r: vertex_r + 8, fill:"none", stroke:color, "stroke-width":"2", visibility:"hidden"});
                dom.label  = svgEl("text", {fill:"black", style:"font-size:12px"});
                dom.label.textContent = node[4] || "";
                dom.name   = svgEl("text", {fill:"black", style:"font-size:12px"});
                dom.name.textContent = node_name;

                vert_group.appendChild(dom.circle);
                vert_group.appendChild(dom.highlight);
                vert_group.appendChild(dom.label);
                vert_group.appendChild(dom.name);

                node._dom = dom;           // 将 DOM 引用挂在 node 上
                node._display_name = node_name;

                // ── 点击节点 → 编辑器光标跳转 / 拖动节点 ───────────────
                [dom.circle, dom.name].forEach(el => {
                    el.style.cursor = 'pointer';
                    el.addEventListener('mousedown', e => {
                        if (e.button !== 0) return;  // 只响应左键
                        e.stopPropagation();
                        e.preventDefault();

                        const startScreenX = e.clientX;
                        const startScreenY = e.clientY;
                        let dragged = false;
                        const DRAG_THRESHOLD = 4;  // 超过这个像素才算拖动

                        const onMouseMove = e => {
                            const totalDx = e.clientX - startScreenX;
                            const totalDy = e.clientY - startScreenY;
                            if (!dragged && Math.sqrt(totalDx*totalDx + totalDy*totalDy) > DRAG_THRESHOLD) {
                                dragged = true;
                                dragging_node = node;
                                graph_view.style.cursor = 'grabbing';
                                el.style.cursor = 'grabbing';
                            }
                            if (dragged) {
                                // 将屏幕坐标直接反算为图坐标，节点始终吸附在鼠标下
                                const rect = graph_view.getBoundingClientRect();
                                const screenX = e.clientX - rect.left;
                                const screenY = e.clientY - rect.top;
                                node[1] = [
                                    (screenX - frame.x) / frame.factor,
                                    (screenY - frame.y) / frame.factor
                                ];
                            }
                        };

                        const onMouseUp = e => {
                            window.removeEventListener('mousemove', onMouseMove);
                            window.removeEventListener('mouseup', onMouseUp);
                            dragging_node = null;
                            graph_view.style.cursor = '';
                            el.style.cursor = 'pointer';

                            if (!dragged) {
                                // 没有拖动 → 触发跳转
                                jumpEditorToState(node[0], node_name, node._jumpInfo);
                            }
                        };

                        window.addEventListener('mousemove', onMouseMove);
                        window.addEventListener('mouseup', onMouseUp);
                    });
                });
            });
        }

        /**
         * 在代码编辑器中找到目标节点对应的行，并将光标跳转过去。
         *
         * - 普通节点：匹配第一元 == state_name 的第一行。
         * - end_from / error_from 节点：利用 source.fromState（第一元）+
         *   source.fromInput（第二元）精确定位那条跳转到 end/error 的规则行。
         *   若一个状态有多条跳到 error 的规则，可通过 input 符号区分。
         *   fromInput 可能是字符串（已去掉引号）、Symbol OTHER、Symbol N，
         *   比较时需还原为代码中的字面形式。
         */
        function jumpEditorToState(raw_name, state_name, jumpInfo) {
            const lines = code_editor_value.split('\n');

            // ── end_from / error_from 节点：用 jumpInfo 定位 ────────────
            if (jumpInfo && (raw_name.startsWith('end_from_') || raw_name.startsWith('error_from_'))) {
                let { lineIndex, lineContent } = jumpInfo;

                // 先按行号快速匹配
                if (lines[lineIndex] !== undefined &&
                    lines[lineIndex].split('//')[0].trim() === lineContent) {
                    code_editor.setCursor(lineIndex, 0, { focus: true });
                    return;
                }

                // 行号处内容已变，全文搜索行内容
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].split('//')[0].trim() === lineContent) {
                        jumpInfo.lineIndex = i;  // 更新缓存的行号
                        code_editor.setCursor(i, 0, { focus: true });
                        return;
                    }
                }

                return;  // 找不到则不跳转
            }

            // ── 普通节点：匹配第一元 ─────────────────────────────────
            for (let i = 0; i < lines.length; i++) {
                const first_token = lines[i].split('//')[0].split(',')[0].trim();
                if (first_token === state_name) {
                    code_editor.setCursor(i, 0, { focus: true });
                    return;
                }
            }

            // 兜底：聚焦编辑器顶部
            code_editor.setCursor(0, 0, { focus: true });
        }

                // ─── 阶段二：每帧只更新坐标属性（不碰 DOM 结构）───────────────
        function update_graph_dom(graph) {
            // 更新连线
            graph.forEach(node => {
                if (node[0].startsWith('self-connection')) return;
                const a = vector_plus([frame.x, frame.y], vector_scale(frame.factor, node[1]));
                node[3].forEach(connection => {
                    const target_node = graph[connection[0]];
                    const b = vector_plus([frame.x, frame.y], vector_scale(frame.factor, target_node[1]));
                    const dom = connection._dom;
                    if (!dom) return;

                    const v = vector_subtract(b, a);
                    const l = vector_length(v);
                    const v_normalized = vector_scale(1./l, v);
                    const normal = [-v_normalized[1], v_normalized[0]];
                    const c = vector_scale(vertex_r, v_normalized);

                    if (target_node[0].startsWith('self-connection')) {
                        const c1 = vector_rotate(c,  self_connection_angle*0.5);
                        const c2 = vector_rotate(c, -self_connection_angle*0.5);
                        const c3 = vector_scale(l/vertex_r, c1);
                        const c4 = vector_scale(l/vertex_r, c2);
                        const p1 = vector_plus(a, c1);
                        const p2 = vector_plus(a, c2);
                        const p3 = vector_plus(a, c3);
                        const p4 = vector_plus(a, c4);
                        const tl = vector_plus(a, vector_scale(self_connection_text_distance_factor, v));
                        dom.path.setAttribute("d", `M ${p1[0]} ${p1[1]} C ${p3[0]} ${p3[1]} ${p4[0]} ${p4[1]} ${p2[0]} ${p2[1]}`);
                        update_arrow_head_el(dom.arrow, p2, vector_scale(-1./vertex_r, c2));
                        dom.text.setAttribute("x", tl[0]-3);
                        dom.text.setAttribute("y", tl[1]+4);
                    } else {
                        if (l > vertex_r*2) {
                            const offset = connection[3];
                            const l_cramp = Math.min(multiple_edges_shape_param2, l);
                            const c1 = vector_rotate(c,  multiple_edges_gap_angle*offset*0.5);
                            const c2 = vector_rotate(c, -multiple_edges_gap_angle*offset*0.5);
                            const p1 = vector_plus(a, c1);
                            const p2 = vector_subtract(b, c2);
                            const p3 = vector_plus(p1,  vector_scale(multiple_edges_shape_param1*l_cramp/vertex_r, c1));
                            const p4 = vector_subtract(p2, vector_scale(multiple_edges_shape_param1*l_cramp/vertex_r, c2));
                            const tl = vector_plus(vector_scale(0.5, vector_plus(p3, p4)), vector_scale(connection_text_offset*Math.sign(offset+0.1), normal));
                            dom.path.setAttribute("d", `M ${p1[0]} ${p1[1]} C ${p3[0]} ${p3[1]} ${p4[0]} ${p4[1]} ${p2[0]} ${p2[1]}`);
                            update_arrow_head_el(dom.arrow, p2, vector_scale(1./vertex_r, c2));
                            dom.text.setAttribute("x", tl[0]-3);
                            dom.text.setAttribute("y", tl[1]+4);
                            dom.path.setAttribute("visibility", "visible");
                            dom.arrow.setAttribute("visibility", "visible");
                        } else {
                            dom.path.setAttribute("visibility", "hidden");
                            dom.arrow.setAttribute("visibility", "hidden");
                        }
                    }
                });
            });

            // 更新节点
            graph.forEach(node => {
                if (!node[2] || !node._dom) return;
                const p = vector_plus([frame.x, frame.y], vector_scale(frame.factor, node[1]));
                const dom = node._dom;
                dom.circle.setAttribute("cx", p[0]);
                dom.circle.setAttribute("cy", p[1]);
                dom.highlight.setAttribute("cx", p[0]);
                dom.highlight.setAttribute("cy", p[1]);
                // 高亮圆环显隐
                dom.highlight.setAttribute("visibility",
                    node._display_name === highlighted_vertex_name ? "visible" : "hidden");
                dom.label.setAttribute("x", p[0]-3);
                dom.label.setAttribute("y", p[1]+4);
                dom.name.setAttribute("x",  p[0]+vertex_name_text_offset[0]-3);
                dom.name.setAttribute("y",  p[1]+vertex_name_text_offset[1]+4);
            });
        }

        var dragging_node = null;  // 正在被拖动的节点，null 表示没有拖动

        var graph = construct_directed_graph_with_code(code);
        if (examples[example]["embedding"] != undefined)  // 如果样例中有预设的节点坐标（embedding），则使用它们覆盖随机生成的坐标
            graph.forEach(node => {
                const pos = examples[example]["embedding"][node[0]];
                if (pos != undefined)
                    node[1] = pos;
            });
        build_graph_dom(graph);

        function graph_evolve() {
            // Vertices repeling
            for(var i = 0; i < graph.length; i++)
                for(var j = 0; j < i; j++) {
                    const v = vector_subtract(graph[j][1], graph[i][1]);
                    const d = vector_length(v);
                    if(d<vertex_prefered_distance) {
                        const force = vector_scale((1-d/vertex_prefered_distance)*vertex_repel_strength/d, v);
                        if(graph[j] !== dragging_node) graph[j][1] = vector_plus(graph[j][1], force);
                        if(graph[i] !== dragging_node) graph[i][1] = vector_subtract(graph[i][1], force);
                    }
                }

            // Connections length preserving
            graph.forEach(node1 => {
                if(node1[0].startsWith('self-connection'))
                    return;
                node1[3].forEach(connection => {
                    const node2 = graph[connection[0]];
                    const prefered_length = connection[2];
                    const v = vector_subtract(node2[1], node1[1]);
                    const d = vector_length(v);
                    const force = vector_scale((1-d/prefered_length)*connection_length_preserve_strength/d, v);
                    if(node2 !== dragging_node) node2[1] = vector_plus(node2[1], force);
                    if(node1 !== dragging_node) node1[1] = vector_subtract(node1[1], force);
                });
            });
        }

        function update_graph_view() {  // 更新图（每帧执行）
            graph_evolve();
            update_graph_dom(graph);  // 只更新坐标属性，不重建 DOM
            
            requestAnimationFrame(update_graph_view);  // 由运行环境决定下次执行的时间（通常与画面刷新率保持一致）
        }

        update_graph_view();

        function toArray(list) {  // Converts list to array. Also can be used to clone an array.
            a = new Array(list.length);
            for(var i=0;i<list.length;i++)
                a[i] = list[i];
            return a;
        }

        function run_turing_machine(code, tape, max_steps, detailed_output) {  // 运行图灵机
            var step = 0;
            var position = 0;
            var state = "start";
            const history = [[step, position, undefined, state, toArray(tape)]];  // 步数, 位置, 上一个状态, 当前状态, 纸带

            tape = toArray(tape);  // Clone the tape, to avoid changing the original tape.
            while(state != "end" && state != "error") {
                var need_record = detailed_output;
                step ++;
                if(step > max_steps)
                    break;

                const state_0 = state;
                var actionDict = code[state];
                if(actionDict == undefined) {
                    state = "error";
                    break;
                }

                if (position >= tape.length)
                    tape.push('');  // Infinite tape to the right
                var action = actionDict[tape[position]];
                if (action == undefined)
                    action = actionDict[OTHER];
                if (action == undefined) {
                    state = "error";
                    break;
                }
                state = action[2];
                if (action[0] == NOT_VALID) {
                    state = "error";
                    break;
                }
                if (action[0] != N) {
                    tape[position] = action[0];
                    need_record = true;
                }

                if(need_record) {
                    history.push([step, position, state_0, state, toArray(tape)]);
                }

                if (action[1] == NOT_VALID) {
                    state = "error";
                    break;
                }
                if(action[1]=="R")
                    position ++;
                else if (action[1]=="L") {
                    position --;
                    if (position < 0)
                        state = "error";  // 不允许移出纸带左边缘
                }
            }

            // 将纸带补到每次记录一样长
            const tapeLength = history[history.length - 1][4].length;
            history.forEach(record => {
                while (record[4].length < tapeLength)
                    record[4].push('');
            });

            return history;
        }

        var tape = toArray(examples[example]["tapes"][0]);

        // 保持纸带右侧有适当数量的空格，方便编辑
        while (tape.length < 3 || tape[tape.length - 1] != '' || tape[tape.length - 2] != '' || tape[tape.length - 3] != '')  // 纸带很短或者右侧没有三个空格
            tape.push('');
        while (tape[tape.length - 1] == '' && tape[tape.length - 2] == '' && tape[tape.length - 3] == '' && tape[tape.length - 4] == '')  // 最后4格全是空的
            tape.pop();

        var detailed_output = false;
        var result = run_turing_machine(code, tape, 3000, detailed_output);
        // console.log(result);

        function generate_history_table_row(record) {
            var s = "";

            s += '<td style="border:none; padding-right:1em; text-align:right">'+record[0]+'</td>';

            position = 0;
            record[4].forEach(e => {
                var style = "border:1px solid black;";

                style_list = result_table_style[e];
                if(style_list) {
                    if(style_list['background'])
                        style += "background-color: " + style_list['background'] + "; ";
                    if(style_list['foreground'])
                        style += "color: " + style_list['foreground'] + "; ";
                }

                if(position==record[1])
                    style += "border-top: 4px solid black; ";

                s += "<td" + (style=="" ? "": ' style="' + style + '"') + ">" + e + "</td>";

                position ++;
            });
            return "<tr>" + s + "</tr>";
        }

        // 用户编辑纸带初值完成回调函数
        function finishEditingTapeCallback(data) {
            if (data.value !== tape[data.cellIndex]) {  // 有变化
                tape[data.cellIndex] = data.value;  // 更新纸带数据

                // 如果纸带最后三格有内容，往后延续。这是为了让用户总可以往后编辑
                if (data.value != '')  // 用户在一格填进了非空内容
                    while (tape.length - data.cellIndex <= 3)
                        tape.push('');
                else  // 用户清空了一个的内容
                    while (tape[tape.length - 1] == '' && tape[tape.length - 2] == '' && tape[tape.length - 3] == '' && tape[tape.length - 4] == '')  // 最后4格全是空的
                        tape.pop();

                run_program();  // 重新运行程序
            }
        }

        function refresh_history_table(history_table, history) {
            if (!result_table_style)
                return;

            var s = "";

            history.forEach(e=>{
                s += generate_history_table_row(e);
            });

            history_table.innerHTML = s;
            
            // 让第一行所有单元格可编辑
            const firstRowCells = history_table.rows[0].cells;  // 获取表格第一行的所有单元格
            for (let i = 0; i < firstRowCells.length; i++) {
                if (i == 0)
                    continue;  // 跳过第一列（步数）
                const cell = firstRowCells[i];
                
                // 设置单元格为可编辑
                cell.contentEditable = true;
                
                // 添加失去焦点事件监听
                cell.addEventListener('blur', function(event) {
                    finishEditingTapeCallback({
                        cellIndex: i - 1,
                        value: cell.textContent
                    });
                });
                
                // 添加键盘事件监听（按下回车）
                cell.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();  // 防止回车产生新行
                        cell.blur();  // 主动失去焦点。这会触发上面的blur事件
                    }
                });
                
                // 保存原始内容，用于对比变化
                cell.setAttribute('data-original-content', cell.textContent);
            }

            // 鼠标悬停显示状态转移
            const rows = history_table.querySelectorAll('tr');
            rows.forEach((row, i) => {
                const record = history[i];
                row.title = `state: ${(record[2] != undefined ? record[2] + " → " : "")}${(record[3] != undefined ? record[3] : "")}`;
            });
        }

        refresh_history_table(history_table, result);

        function refresh_graph_embedding() {  // 根据代码重建有向图（这个函数不用每帧执行，只在图架构有变化时才需要执行）
            // TODO: real-time compile
            code = parseProgramCode(code_editor_value);  // 解析代码文本
            graph = construct_directed_graph_with_code(code);
            build_graph_dom(graph);  // 图结构变了，重建 DOM
        }

        function run_program() {
            code = parseProgramCode(code_editor_value);  // 解析代码文本
            result = run_turing_machine(code, tape, max_steps_input.value, detailed_output);
            refresh_history_table(history_table, result);
        }

        // Add event listeners

        code_editor.addEventListener('tm-refresh-graph', e => {  // 按 F4 刷新图
            refresh_graph_embedding();
        });

        code_editor.addEventListener('tm-run', e => {  // 按 F5 运行程序
            run_program();
        });

        code_editor.addEventListener('tm-change', e => {  // 代码编辑器内容变化监听器
            const {
                value,  // 新的完整代码
                errorCount,  // 错误计数
                changedLines  // 变化的行的列表。当用户键入换行符时，这一行以及下面所有的行都会被判定为发生了变化
            } = e.detail;
            code_editor_value = value;  // 更新代码文本
            codeModified = true;  // 标记用户已修改代码
            
            // 遍历变化的行，更新高亮的节点
            changedLines.forEach(line => {
                if (line['line'] == editing_line) {  // 如果变化的行包含光标所在行
                    let content = line['content'];
                    content = content.split("//")[0].trim();  // 去掉注释
                    if (content.length > 0) {
                        const state_name = content.split(",")[0].trim();  // 获取状态名称
                        highlighted_vertex_name = state_name;  // 更新高亮的节点名称
                    }
                    else
                        highlighted_vertex_name = undefined;  // 没有状态名称，取消高亮
                }
            });
        });

        code_editor.addEventListener('tm-cursor-line-change', e => {  // 代码编辑器光标移动到新行监听器
            let { line, content } = e.detail;  // 行号（第一行为0）以及该行的内容
            editing_line = line;

            content = content.split("//")[0].trim();  // 去掉注释

            // 更新高亮的节点
            if (content.length > 0) {
                const state_name = content.split(",")[0].trim();  // 获取状态名称
                highlighted_vertex_name = state_name;
            }
            else {
                highlighted_vertex_name = undefined;
            }
        });

        // code_editor.addEventListener('tm-errors', e => {  // 代码编辑器语法错误监听器
        //     const { errorCount } = e.detail;
        //     addLog(`[tm-errors] 错误数量变为 ${errorCount}`);
        // });

        style_editor.addEventListener('cm-change', e => {  // 风格编辑器内容变化监听器
            const result_table_style_text = style_editor.value;
            result_table_style = parseStyleCode(result_table_style_text);
            refresh_history_table(history_table, result);
            styleModified = true;  // 标记用户已修改样式代码
        });

        // style_textarea.addEventListener('cm-errors', e => {  // 风格编辑器语法错误监听器
        //     console.log('errors:', e.detail.errors);
        // });

        graph_view.addEventListener("mousedown", e => {  // Middle button dragging for moving the graph
            if(e.button == 1) {
                var last_position = [e.offsetX, e.offsetY];
                graph_view.style.cursor = "grabbing";  // Change cursor to grabbing
                var on_mouse_move = e => {
                    const new_position = [e.offsetX, e.offsetY];
                    frame.x += new_position[0] - last_position[0];
                    frame.y += new_position[1] - last_position[1];
                    last_position = new_position;
                };
                var on_mouse_up = e => {
                    window.removeEventListener("mousemove", on_mouse_move);  // Remove listeners after dragging is done
                    window.removeEventListener("mouseup", on_mouse_up);
                    graph_view.style.cursor = "default";  // Change cursor back to default
                };
                window.addEventListener("mousemove", on_mouse_move);
                window.addEventListener("mouseup", on_mouse_up);
            }
        });

        graph_view.addEventListener("wheel", e => {  // Wheel scrolling for zooming the graph
            const zoom_factor = 1.1;
            if(e.deltaY < 0) {  // Zoom in
                frame.factor *= zoom_factor;
                frame.x = e.offsetX + zoom_factor * (frame.x - e.offsetX);
                frame.y = e.offsetY + zoom_factor * (frame.y - e.offsetY);
            }
            else {  // Zoom out
                frame.factor /= zoom_factor;
                frame.x = e.offsetX + (1 / zoom_factor) * (frame.x - e.offsetX);
                frame.y = e.offsetY + (1 / zoom_factor) * (frame.y - e.offsetY);
            }
        });
    </script>

    </div><!-- #main-area -->

    <!-- ══ Menu Bar + File I/O ══════════════════════════════════════════ -->
    <script>
    // ── i18n strings ────────────────────────────────────────────────────
    const MENU_I18N = {
        zh: {
            file:           '文件',
            edit:           '编辑',
            help:           '帮助',
            preferences:    '偏好',
            language:       '语言',
            langZh:         '中文',
            langEn:         'English',
            examples:       '样例',
            openProject:    '打开工程',
            saveProject:    '保存工程',
            saveEmbedding:  '保存图嵌入',
            about:          '关于',
            aboutTitle:     'Turing Machine IDE',
            aboutVersion:   '版本 1.0',
            aboutBody:      `<p>这是一款基于 Electron 的图灵机程序编写与调试工具。</p>
                             <p>您可以在左侧代码面板中编写图灵机程序，在中间面板中查看状态转移图，在右侧面板中观察纸带的运行历史。</p>
                             <p><b>开发者：</b>武圣智<br>
                             <b>许可证：</b>MIT</p>`,
            closeBtn:       '关闭',
            saveDialogTitle:'保存工程',
            embedDialogTitle:'保存图嵌入',
            openDialogTitle: '打开工程',
            maxSteps:       '最大步数',
            runBtnTitle:    '运行程序 (F5)',
            refreshBtnTitle:'重置图嵌入',
        },
        en: {
            file:           'File',
            edit:           'Edit',
            help:           'Help',
            preferences:    'Preferences',
            language:       'Language',
            langZh:         '中文',
            langEn:         'English',
            examples:       'Examples',
            openProject:    'Open Project',
            saveProject:    'Save Project',
            saveEmbedding:  'Save Graph Embedding',
            about:          'About',
            aboutTitle:     'Turing Machine IDE',
            aboutVersion:   'Version 1.0',
            aboutBody:      `<p>A Turing machine programming and debugging tool built with Electron.</p>
                             <p>Write your Turing machine program in the code panel on the left, inspect the state-transition graph in the centre, and trace the tape history on the right.</p>
                             <p><b>Developer:</b>Shengzhi Wu<br>
                             <b>License:</b> MIT</p>`,
            closeBtn:       'Close',
            saveDialogTitle:'Save Project',
            embedDialogTitle:'Save Graph Embedding',
            openDialogTitle: 'Open Project',
            maxSteps:       'Max steps',
            runBtnTitle:    'Run Program (F5)',
            refreshBtnTitle:'Initialize Graph Embedding',
        }
    };

    function t(key) {
        const lang = (typeof language !== 'undefined') ? language : 'en';
        return (MENU_I18N[lang] || MENU_I18N['en'])[key] || MENU_I18N['en'][key] || key;
    }

    // ── Menu bar rendering ───────────────────────────────────────────────
    function buildMenuBar() {
        const bar = document.getElementById('menu-bar');
        bar.innerHTML = '';

        const menus = [
            {
                label: t('file'),
                items: [
                    { label: t('openProject'),   action: menuOpenProject },
                    { label: t('saveProject'),   action: menuSaveProject },
                    { label: t('saveEmbedding'), action: menuSaveEmbedding },
                    'separator',
                    {
                        label: t('examples'),
                        submenu: Object.keys(examples).map(key => ({
                            label: (examples[key]['name'][language] || examples[key]['name']['en']),
                            action: () => menuLoadExample(key)
                        }))
                    },
                    'separator',
                    {
                        label: t('preferences'),
                        submenu: [
                            {
                                label: t('language'),
                                submenu: [
                                    {
                                        label: t('langZh'),
                                        checked: () => language === 'zh',
                                        action: () => switchLanguage('zh')
                                    },
                                    {
                                        label: t('langEn'),
                                        checked: () => language === 'en',
                                        action: () => switchLanguage('en')
                                    },
                                ]
                            },
                        ]
                    },
                ]
            },
            {
                label: t('edit'),
                items: []  // 暂时空着
            },
            {
                label: t('help'),
                items: [
                    { label: t('about'), action: menuAbout },
                ]
            }
        ];

        function buildDropdownItems(items, container) {
            items.forEach(entry => {
                if (entry === 'separator') {
                    const sep = document.createElement('hr');
                    sep.className = 'menu-dropdown-separator';
                    container.appendChild(sep);
                } else if (entry.submenu) {
                    // Item with submenu
                    const di = document.createElement('div');
                    di.className = 'menu-dropdown-item has-submenu';

                    const labelSpan = document.createElement('span');
                    labelSpan.textContent = entry.label;
                    di.appendChild(labelSpan);

                    const sub = document.createElement('div');
                    sub.className = 'menu-submenu';
                    buildSubmenuItems(entry.submenu, sub);
                    di.appendChild(sub);

                    container.appendChild(di);
                } else {
                    const di = document.createElement('div');
                    di.className = 'menu-dropdown-item';
                    di.textContent = entry.label;
                    di.addEventListener('mousedown', e => {
                        e.preventDefault();
                        e.stopPropagation();
                        closeAllMenus();
                        entry.action();
                    });
                    container.appendChild(di);
                }
            });
        }

        function buildSubmenuItems(items, container) {
            items.forEach(entry => {
                if (entry.submenu) {
                    // Nested submenu
                    const di = document.createElement('div');
                    di.className = 'menu-submenu-item has-submenu';
                    const labelSpan = document.createElement('span');
                    labelSpan.textContent = entry.label;
                    di.appendChild(labelSpan);

                    const sub = document.createElement('div');
                    sub.className = 'menu-submenu';
                    buildSubmenuItems(entry.submenu, sub);
                    di.appendChild(sub);
                    container.appendChild(di);
                } else {
                    const di = document.createElement('div');
                    di.className = 'menu-submenu-item';

                    const check = document.createElement('span');
                    check.className = 'checkmark';
                    check.textContent = entry.checked && entry.checked() ? '✓' : '';
                    di.appendChild(check);

                    const labelSpan = document.createElement('span');
                    labelSpan.textContent = entry.label;
                    di.appendChild(labelSpan);

                    di.addEventListener('mousedown', e => {
                        e.preventDefault();
                        e.stopPropagation();
                        closeAllMenus();
                        entry.action();
                    });
                    container.appendChild(di);
                }
            });
        }

        menus.forEach(menu => {
            const item = document.createElement('div');
            item.className = 'menu-item';
            item.textContent = menu.label;

            if (menu.items.length > 0) {
                const dropdown = document.createElement('div');
                dropdown.className = 'menu-dropdown';

                buildDropdownItems(menu.items, dropdown);

                item.appendChild(dropdown);
            }

            item.addEventListener('mousedown', e => {
                e.preventDefault();
                const wasActive = item.classList.contains('active');
                closeAllMenus();
                if (!wasActive) item.classList.add('active');
            });

            bar.appendChild(item);
        });

        // Click outside → close
        document.addEventListener('mousedown', e => {
            if (!bar.contains(e.target)) closeAllMenus();
        });
    }

    function closeAllMenus() {
        document.querySelectorAll('.menu-item.active').forEach(el => el.classList.remove('active'));
    }

    // ── About dialog ─────────────────────────────────────────────────────
    function menuAbout() {
        document.getElementById('about-title').textContent   = t('aboutTitle');
        document.getElementById('about-version-line').textContent = t('aboutVersion');
        document.getElementById('about-body').innerHTML      = t('aboutBody');
        document.getElementById('about-close-btn').textContent = t('closeBtn');
        document.getElementById('about-overlay').classList.add('visible');
    }

    function closeAbout() {
        document.getElementById('about-overlay').classList.remove('visible');
    }

    // Close about dialog when clicking outside
    document.getElementById('about-overlay').addEventListener('mousedown', function(e) {
        if (e.target === this) closeAbout();
    });

    // ── JSON project serialisation ───────────────────────────────────────
    // JSON 标准本身天然支持字符串中的单引号和双引号（双引号在 JSON 值中会被转义
    // 为 \"），因此直接用 JSON.stringify / JSON.parse 即可，无需任何额外处理。

    function getGraphEmbedding() {
        // 返回所有节点（含 self-connection）的名称 + 坐标
        if (typeof graph === 'undefined') return {};
        const result = {};
        graph.forEach(node => {
            result[node[0]] = [node[1][0], node[1][1]];
        });
        return result;
    }

    function applyGraphEmbedding(embedding) {
        if (typeof embedding !== 'object' || Array.isArray(embedding) || typeof graph === 'undefined') return;
        for (const [name, coords] of Object.entries(embedding)) {
            const node = graph.find(n => n[0] === name);
            if (node) node[1] = [coords[0], coords[1]];
        }
    }

    function getTapeInitial() {
        // tape 是当前纸带数组（含末尾空格），取有效内容部分
        if (typeof tape === 'undefined') return [];
        // 去掉末尾的空字符串
        let t = [...tape];
        while (t.length > 0 && t[t.length - 1] === '') t.pop();
        return t;
    }

    function buildProjectJSON() {
        return {
            version: '1.0',
            code:      (typeof code_editor_value !== 'undefined') ? code_editor_value : '',
            style:     (typeof style_editor      !== 'undefined') ? style_editor.value : '',
            embedding: getGraphEmbedding(),
            tape:      getTapeInitial(),
        };
    }

    function buildEmbeddingJSON() {
        return {
            version: '1.0',
            embedding: getGraphEmbedding(),
        };
    }

    // ── File save / open via Electron dialog or fallback ────────────────
    function saveJSONFile(obj, defaultName) {
        const json = JSON.stringify(obj, null, 2);

        // Electron IPC path
        if (typeof window !== 'undefined' && window.electronAPI && window.electronAPI.saveFile) {
            window.electronAPI.saveFile({ defaultName, content: json });
            return;
        }

        // Browser fallback: <a download>
        const blob = new Blob([json], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = defaultName;
        a.click();
        URL.revokeObjectURL(url);
    }

    function openJSONFile(callback) {
        // Electron IPC path
        if (typeof window !== 'undefined' && window.electronAPI && window.electronAPI.openFile) {
            window.electronAPI.openFile().then(result => {
                if (result) callback(JSON.parse(result));
            });
            return;
        }

        // Browser fallback: <input type=file>
        const input = document.createElement('input');
        input.type   = 'file';
        input.accept = '.json,application/json';
        input.addEventListener('change', () => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    callback(JSON.parse(e.target.result));
                } catch(err) {
                    alert('Failed to parse JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
        });
        input.click();
    }

    // ── Menu actions ─────────────────────────────────────────────────────
    function menuSaveProject() {
        saveJSONFile(buildProjectJSON(), 'project.json');
    }

    function menuSaveEmbedding() {
        saveJSONFile(buildEmbeddingJSON(), 'embedding.json');
    }

    function menuOpenProject() {
        openJSONFile(obj => {
            if (!obj || !obj.version) { alert('Invalid project file.'); return; }

            // 恢复代码
            if (typeof obj.code === 'string' && typeof code_editor !== 'undefined') {
                code_editor.value = obj.code;
                code_editor_value = obj.code;
            }

            // 恢复样式代码
            if (typeof obj.style === 'string' && typeof style_editor !== 'undefined') {
                style_editor.value = obj.style;
                result_table_style = parseStyleCode(obj.style);
            }

            // 恢复图嵌入（先刷新图结构，再覆盖坐标）
            if (typeof refresh_graph_embedding === 'function') {
                refresh_graph_embedding();
            }
            if (obj.embedding && typeof obj.embedding === 'object') {
                applyGraphEmbedding(obj.embedding);
            }

            // 恢复纸带
            if (Array.isArray(obj.tape) && typeof tape !== 'undefined') {
                tape = [...obj.tape];
                // 保持末尾至少三个空格
                while (tape.length < 3 || tape[tape.length-1] !== '' || tape[tape.length-2] !== '' || tape[tape.length-3] !== '')
                    tape.push('');
                while (tape[tape.length-1] === '' && tape[tape.length-2] === '' && tape[tape.length-3] === '' && tape[tape.length-4] === '')
                    tape.pop();
            }

            // 重新运行
            if (typeof run_program === 'function') run_program();
        });
    }

    function menuLoadExample(key) {
        const lang = (typeof language !== 'undefined') ? language : 'en';
        const ex = examples[key];
        example = key;  // 记录当前样例

        // 载入图灵机代码
        const code = ex['code'][lang] || ex['code']['en'];
        code_editor_value = code;
        code_editor.value = code;

        // 载入样式代码
        const styleCode = ex['style'][lang] || ex['style']['en'];
        style_editor.value = styleCode;
        result_table_style = parseStyleCode(styleCode);

        // 载入纸带初值
        tape = toArray(ex['tapes'][0]);
        while (tape.length < 3 || tape[tape.length-1] !== '' || tape[tape.length-2] !== '' || tape[tape.length-3] !== '')
            tape.push('');
        while (tape[tape.length-1] === '' && tape[tape.length-2] === '' && tape[tape.length-3] === '' && tape[tape.length-4] === '')
            tape.pop();

        // 刷新有向图
        refresh_graph_embedding();

        // 若有预设嵌入坐标则应用
        if (ex['embedding'] !== undefined) {
            applyGraphEmbedding(ex['embedding']);
        }

        // 运行程序
        if (typeof run_program === 'function') run_program();

        // 重置修改标记
        codeModified = false;
        styleModified = false;
    }

    // ── Language switching ────────────────────────────────────────────────
    function applyLanguageToUI() {
        // Update non-menu UI elements
        const runBtn = document.getElementById('run-btn');
        if (runBtn) runBtn.title = ' ' + t('runBtnTitle');

        const refreshBtn = document.getElementById('refresh-btn');
        if (refreshBtn) refreshBtn.title = t('refreshBtnTitle');

        const maxStepsLabel = document.getElementById('max-steps-label');
        if (maxStepsLabel) maxStepsLabel.textContent = t('maxSteps');

        // Update code/style editor lang attribute (for placeholder/hint text only, not content)
        const code_ed = document.querySelector('#code-editor');
        const style_ed = document.querySelector('#style-textarea');
        if (code_ed) code_ed.lang = language;
        if (style_ed) style_ed.lang = language;
    }

    function switchLanguage(lang) {
        language = lang;

        // 若用户未修改过代码，替换成新语言版本的样例代码
        // 若用户已修改，为了避免丢失修改，保持现有代码不变
        if (!codeModified && typeof example !== 'undefined' && examples[example]) {
            const code = examples[example]['code'][lang] || examples[example]['code']['en'];
            code_editor_value = code;
            code_editor.value = code;
        }
        if (!styleModified && typeof example !== 'undefined' && examples[example]) {
            const styleCode = examples[example]['style'][lang] || examples[example]['style']['en'];
            style_editor.value = styleCode;
            result_table_style = parseStyleCode(styleCode);
        }

        buildMenuBar();       // 重建菜单栏（含新语言的标签和勾选状态）
        applyLanguageToUI();  // 更新其他界面元素
    }

    // ── Init ─────────────────────────────────────────────────────────────
    buildMenuBar();
    applyLanguageToUI();
    </script>

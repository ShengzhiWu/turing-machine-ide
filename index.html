<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turing Machine IDE</title>
    <style>
        #refresh-btn {
            position: absolute;
            left: 0.5em;
            top: 0.5em;
            width: 2em;
            height: 2em;
            margin: 0; padding: 0;
            background-color: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .glow-icon {
            width: 2em;
            height: 2em;
            fill: none;
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        #refresh-btn:hover .glow-icon {
            stroke: white;
        }

        #refresh-btn:active .glow-icon {
            stroke: white;
            filter: drop-shadow(0 0 4px rgba(255,255,255,1));
        }

        #run-btn {
            height: 3em;
            margin-left: 20%; margin-right: 20%;
            border-radius: 1.5em; border: none;
            background-color: rgb(63, 138, 63);
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        #run-btn:hover {
            background-color: rgb(97, 170, 97);
        }

        td { width: 1.5em; }

        /* ── Menu Bar ── */
        #menu-bar {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            height: 28px;
            background: linear-gradient(to right, hsl(222, 25%, 21%), hsl(0, 0%, 75%));
            color: rgba(255,255,255,0.85);
            font-size: 13px;
            font-family: system-ui, sans-serif;
            user-select: none;
            flex-shrink: 0;
            z-index: 1000;
            position: relative;
        }

        .menu-item {
            position: relative;
            padding: 0 14px;
            display: flex;
            align-items: center;
            cursor: default;
            white-space: nowrap;
        }

        .menu-item:hover,
        .menu-item.active {
            background-color: hsl(210, 60%, 40%);
            color: white;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 200px;
            background-color: hsl(224, 17%, 22%);
            border: 1px solid hsl(0, 0%, 35%);
            box-shadow: 2px 4px 12px rgba(0,0,0,0.5);
            z-index: 1001;
            padding: 3px 0;
        }

        .menu-item.active .menu-dropdown {
            display: block;
        }

        .menu-dropdown-item {
            padding: 6px 18px;
            color: rgba(255,255,255,0.85);
            cursor: default;
            white-space: nowrap;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .menu-dropdown-item:hover {
            background-color: hsl(210, 60%, 40%);
            color: white;
        }

        .menu-dropdown-item.disabled {
            color: rgba(255,255,255,0.35);
            pointer-events: none;
        }

        .menu-dropdown-separator {
            border: none;
            border-top: 1px solid hsl(0, 0%, 35%);
            margin: 3px 0;
        }

        /* ── Submenu ── */
        .menu-dropdown-item.has-submenu {
            position: relative;
        }

        .menu-dropdown-item.has-submenu::after {
            content: '▶';
            font-size: 9px;
            opacity: 0.7;
            margin-left: auto;
            padding-left: 8px;
        }

        .menu-submenu {
            display: none;
            position: absolute;
            top: -3px;
            left: 100%;
            min-width: 140px;
            background-color: hsl(224, 17%, 22%);
            border: 1px solid hsl(0, 0%, 35%);
            box-shadow: 2px 4px 12px rgba(0,0,0,0.5);
            z-index: 1002;
            padding: 3px 0;
        }

        .menu-dropdown-item.has-submenu:hover > .menu-submenu {
            display: block;
        }

        .menu-submenu-item {
            padding: 6px 18px;
            color: rgba(255,255,255,0.85);
            cursor: default;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-submenu-item:hover {
            background-color: hsl(210, 60%, 40%);
            color: white;
        }

        .menu-submenu-item.has-submenu::after {
            content: '▶';
            font-size: 9px;
            opacity: 0.7;
            margin-left: auto;
            padding-left: 8px;
        }

        .menu-submenu-item.has-submenu:hover > .menu-submenu {
            display: block;
        }

        .menu-submenu-item .checkmark {
            width: 12px;
            display: inline-block;
            font-size: 11px;
        }

        /* ── Main content area ── */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            min-height: 0;
        }

        /* ── About Modal ── */
        #about-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        #about-overlay.visible {
            display: flex;
        }

        #about-dialog {
            background: hsl(0, 0%, 14%);
            color: rgba(255,255,255,0.88);
            border: 1px solid hsl(0,0%,35%);
            border-radius: 8px;
            padding: 28px 34px;
            min-width: 340px;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            font-family: system-ui, sans-serif;
            font-size: 13px;
            line-height: 1.7;
            position: relative;
        }

        #about-dialog h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        #about-dialog .about-version {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            margin-bottom: 16px;
        }

        #about-close-btn {
            margin-top: 20px;
            padding: 6px 22px;
            background: hsl(210, 60%, 40%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: block;
            margin-left: auto;
        }

        #about-close-btn:hover {
            background: hsl(210, 60%, 52%);
        }

        /* ── tape-panel controls ── */
        #tape-panel-controls {
            display: flex;
            flex-direction: column;
            gap: 0.4em;
            padding: 0 0.5em;
            flex-shrink: 0;
        }

        #tape-panel-controls label {
            display: flex;
            align-items: center;
            gap: 0.4em;
            font-size: 0.85em;
            cursor: pointer;
            user-select: none;
        }

        /*
         * 横纵缩放行。
         * CSS 里不写 display:none，避免 JS 用 display='' 回退时仍被 CSS 覆盖。
         * 初始隐藏完全由 HTML inline style="display:none" 负责；
         * JS 里显示时设 display='flex'，隐藏时设 display='none'。
         */
        #pixel-scale-wrapper {
            align-items: center;
            gap: 0.4em;
            font-size: 0.85em;
            margin-left: 1.4em;
            flex-wrap: wrap;
        }

        #pixel-scale-wrapper input[type=number] {
            width: 3.5em;
        }

        /* ── 底部保存按钮 ── */
        #save-btn-row {
            display: flex;
            gap: 0.5em;
            padding: 0 0.5em 0.5em;
            flex-shrink: 0;
        }

        #save-btn-row button {
            flex: 1;
            padding: 0.3em 0;
            cursor: pointer;
            font-size: 0.82em;
        }

        /*
         * bitmap 容器。
         * 同理，CSS 里不写 display:none；初始隐藏由 inline style 负责。
         * JS 里显示时设 display='flex'，隐藏时设 display='none'。
         */
        #bitmap-container {
            flex: 1;
            overflow: scroll;
            min-height: 0;
            background-color: white;
            /* align-items:flex-start 阻止 canvas 在交叉轴方向被拉伸 */
            display: flex;
            align-items: flex-start;
        }

        #bitmap-canvas {
            /* canvas 尺寸完全由 width/height 属性决定，不参与 flex 伸缩 */
            flex-shrink: 0;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* (Render Animation and Preview are now separate Electron windows) */
    </style>
</head>
<body style="margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;">
    <!-- 修复 Electron 中 jQuery 无法挂载到 window 的问题 -->
    <script>
        if (typeof module === 'object') { window.module = module; module = undefined; }
    </script>

    <!-- jQuery and draggable / resizable functionality -->
    <script src="src/vendor/jquery/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="src/vendor/jquery/jquery-ui.css">
    <script src="src/vendor/jquery/jquery-ui.js"></script>

    <!-- 加载完后恢复 module -->
    <script>
        if (window.module) module = window.module;
    </script>

    <!-- CodeMirror 核心（本地文件） -->
    <link rel="stylesheet" href="src/vendor/codemirror/codemirror.min.css">
    <script src="src/vendor/codemirror/codemirror.min.js"></script>

    <!-- codemirror-colorpicker（本地文件） -->
    <link rel="stylesheet" href="src/vendor/codemirror-colorpicker/codemirror-colorpicker.css">
    <script src="src/vendor/codemirror-colorpicker/codemirror-colorpicker.js"></script>

    <script src="src/tm-editor.js"></script>
    <script src="src/colormap-editor.js" defer></script>

    <!-- ── Menu Bar ── -->
    <div id="menu-bar"></div>

    <!-- ── About Dialog ── -->
    <div id="about-overlay">
        <div id="about-dialog">
            <h2 id="about-title">Turing Machine IDE</h2>
            <div class="about-version" id="about-version-line">Version 1.0</div>
            <div id="about-body"></div>
            <button id="about-close-btn" onclick="closeAbout()"></button>
        </div>
    </div>

    <!-- ── Main content area (panels) ── -->
    <div id="main-area">

    <div id="code-panel" style="width: 33%; height: 100%; overflow: hidden; display: flex; flex-direction: column; background-color: hsl(0, 0%, 0%);">
        <div id="turing_machine_code-panel" style="flex: 0 0 auto; margin-bottom: 2px; height: 70%; overflow: hidden;">
            <div style="height: 100%;">
                <tm-editor id="code-editor" value=''></tm-editor>
            </div>
        </div>
        <div id="style-panel" style="flex: 1 1 auto; min-height: 50px; overflow: hidden;">
            <div style="height: 100%;">
                <colormap-editor id="style-textarea"></colormap-editor>
            </div>
        </div>
    </div>

    <div id="graph-panel" style="width: 40%; background-color: hsl(0, 0%, 60%);">
        <svg id="graph-view" style="position: absolute; width:100%; height:100%;"></svg>
        <button id="refresh-btn" title="Initialize Graph Embedding" onclick="refresh_graph_embedding();">
            <svg class="glow-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                <path d="M21 12 A9 9 0 1 1 18.36 5.64" />
                <polyline points="18.36 1.64 18.36 5.64 14.36 5.64" />
            </svg>
        </button>
    </div>

    <div id="tape-panel" style="padding-top: 0.5em; flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 0.5em; background-color: hsl(0, 0%, 90%);">

        <!-- 1. 运行按钮 -->
        <button id="run-btn" title=" Run Program (F5)" onclick="run_program();" style="color: white;">▶</button>

        <!-- 2 – 4. 参数控件 -->
        <div id="tape-panel-controls">

            <!-- 2. 最大步数 -->
            <div>
                <span id="max-steps-label">Max steps</span>
                <input id="max-steps-input" type="text" value="3000"/>
            </div>

            <!-- 3. 仅记录纸带有变化的步
                 checked = 勾选 → detailed_output = false（只记录有变化的步）
                 未勾选  →        detailed_output = true （记录每一步）      -->
            <label>
                <input type="checkbox" id="only-changes-checkbox" checked>
                <span id="detailed-output-label">仅记录纸带有变化的步</span>
            </label>

            <!-- 4. 极简模式 -->
            <label>
                <input type="checkbox" id="minimal-mode-checkbox">
                <span id="minimal-mode-label">极简模式</span>
            </label>

            <!-- 横纵缩放（极简模式时才显示）
                 初始 display:none 写在 inline style 里，CSS 里不写，
                 这样 JS 设 display='flex' 时不会被 CSS 覆盖回 none。 -->
            <div id="pixel-scale-wrapper" style="display: none;">
                <span id="pixel-scale-x-label">横向缩放</span>
                <input id="pixel-scale-x-input" type="number" value="1" min="1" max="32" step="1">
                <span id="pixel-scale-y-label">纵向缩放</span>
                <input id="pixel-scale-y-input" type="number" value="1" min="1" max="32" step="1">
            </div>

        </div>

        <!-- 5a. 普通表格容器 -->
        <div id="table-container" style="flex: 1; overflow: hidden; min-height: 0;">
            <div style="overflow: scroll; height: 100%;">
                <div style="width: max-content; padding-bottom: 1em; background-color: white;">
                    <table id="history-table" style="line-height: 1.2em; border-collapse: collapse; text-align:center; font-size:0.75em;"></table>
                </div>
            </div>
        </div>

        <!-- 5b. 极简位图容器
             初始 display:none 写在 inline style 里，CSS 里不写，
             JS 显示时设 display='flex'，隐藏时设 display='none'。 -->
        <div id="bitmap-container" style="display: none;">
            <canvas id="bitmap-canvas"></canvas>
        </div>

        <!-- 6. 保存按钮 -->
        <div id="save-btn-row">
            <button id="save-table-btn" onclick="saveTableData();">
                <span id="save-table-label">保存表格数据</span>
            </button>
            <button id="save-image-btn" onclick="saveAsImage();">
                <span id="save-image-label">保存为图片</span>
            </button>
        </div>

    </div><!-- #tape-panel -->

    <script>
        // Initialize resizable panels
        $(function() {
            $("#code-panel").resizable({ handles: "e" });
            $("#graph-panel").resizable({ handles: "e" });
            $("#turing_machine_code-panel").resizable({ handles: "s" });
        });
    </script>

    <!-- 加载样例文件 -->
    <script src="src/examples/binary-counting.js"></script>
    <script src="src/examples/binary-addition.js"></script>
    <script src="src/examples/binary-division.js"></script>
    <script src="src/examples/spigot-e.js"></script>
    <script src="src/examples/move-bricks.js"></script>
    <script src="src/examples/copy-bricks.js"></script>
    <script src="src/examples/reverse-sequence.js"></script>
    <script src="src/examples/addition.js"></script>
    <script src="src/examples/multiplication.js"></script>
    <script src="src/examples/596440.js"></script>
    <script src="src/examples/busy-beaver-3.js"></script>
    <script src="src/examples/busy-beaver-4.js"></script>
    <script src="src/examples/busy-beaver-5.js"></script>
    <script src="src/examples/rule-2506.js"></script>
    <script src="src/examples/rule-1953.js"></script>
    <script src="src/examples/rule-982.js"></script>
    <script src="src/examples/busy-beaver-3-3-old.js"></script>
    <script src="src/examples/busy-beaver-3-3.js"></script>
    <script src="src/examples/collatz-conjecture.js"></script>
    <script src="src/examples/collatz-conjecture-fast.js"></script>

    <script>
        var language = 'zh';  // 默认语言，支持zh、en。如果设置了不支持的语言，将回退到en
        var example = '596440';  // 默认样例
        var codeModified;   // 用户是否修改过图灵机代码
        var styleModified;  // 用户是否修改过样式代码
    </script>

    </div><!-- #main-area -->

    <!-- ── Application scripts ─────────────────────────────────── -->
    <script src="src/tm-core.js"></script>
    <script src="src/graph.js"></script>

    <script>
        // ── DOM references ──────────────────────────────────────────────
        const code_editor     = document.querySelector('#code-editor');
        const style_editor    = document.querySelector('#style-textarea');
        const graph_view      = document.querySelector('#graph-view');
        const max_steps_input = document.querySelector('#max-steps-input');
        const history_table   = document.querySelector('#history-table');

        // ── 初始编辑器内容 ──────────────────────────────────────────────
        var code_editor_value = examples[example]['code'][language] || examples[example]['code']['en'];
        code_editor.value = code_editor_value;
        setTimeout(() => { codeModified = false; }, 10);
        code_editor.lang = language;
        style_editor.lang = language;

        // ── 解析代码与样式 ──────────────────────────────────────────────
        var code = parseProgramCode(code_editor_value);

        style_editor.addEventListener('ready', () => {
            style_editor.value = examples[example]['style'][language] || examples[example]['style']['en'];
            styleModified = false;
        });

        var editing_line = 0;
        var highlighted_vertex_name;
        var result_table_style;

        // ── 初始化有向图 ────────────────────────────────────────────────
        var dragging_node = null;

        var graph = construct_directed_graph_with_code(code);
        if (examples[example]['embedding'] != undefined)
            graph.forEach(node => {
                const pos = examples[example]['embedding'][node[0]];
                if (pos != undefined) node[1] = pos;
            });
        build_graph_dom(graph);
        update_graph_view();

        // ── 初始化纸带与运行结果 ────────────────────────────────────────
        // detailed_output=false → 仅记录纸带有变化的步，对应 checkbox 默认勾选
        if (examples[example]["recommended-max-steps"])
            max_steps_input.value = examples[example]["recommended-max-steps"];
        var start_position = 0;
        var tape = normalizeTape([...examples[example]['tapes'][0]]);
        var detailed_output = false;
        var result = run_turing_machine(code, tape, parseInt(max_steps_input.value), detailed_output, start_position);
        tape = result[0][4];
        start_position = result[0][1];
    </script>

    <script src="src/app.js"></script>
    <script src="src/menu.js"></script>
    <script src="src/render-anim.js"></script>

    <script>
        // ── 启动 ────────────────────────────────────────────────────────
        buildMenuBar();
        applyLanguageToUI();
    </script>
</body>
</html>

        #refresh-btn {

        const NOT_VALID = Symbol('not valid');
        const N = Symbol('N');
        const OTHER = Symbol('other');

        function parseCode(code) { // 解析新格式代码
            const result = {};
            code.split("\n").forEach(line => {  // 遍历行
                // 去掉注释
                line = line.split("//")[0].trim();

                if (line.length == 0)
                    return;
                
                const parts = line.split(",").map(part => part.trim());

                const state = parts[0];
                let input = parts[1];
                if (input == 'other')
                    input = OTHER;
                else {
                    if (input == undefined || !input.startsWith('"') || !input.endsWith('"'))
                        input = NOT_VALID;  // 无效值
                    else
                        input = input.slice(1, -1);  // 去掉引号
                }
                let output = parts[2];
                if (output == 'N')
                    output = N;
                else {
                    if (output == undefined || !output.startsWith('"') || !output.endsWith('"'))
                        output = NOT_VALID;  // 无效值
                    else
                        output = output.slice(1, -1);  // 去掉引号
                }
                let direction = parts[3];
                if (direction != 'L' && direction != 'R' && direction != 'N')
                    direction = NOT_VALID;
                let nextState = parts[4];
                if (nextState == undefined)
                    nextState = state;

                if (result[state] == undefined)
                    result[state] = {};
                result[state][input] = [output, direction, nextState];
            });

            return result;
        }

        var global_size_factor = 0.5;

        var connection_length_preserve_strength = 0.01*global_force_factor;  // 0.02

        class RandomGenerator {
            constructor(seed) {
                this.seed = seed;
                this.multiplier = 1664525;
                this.increment = 1013904223;
                this.modulus = Math.pow(2, 32);
                this.state = seed;
            }

            next() {  // 0~1
                this.state = (this.state * this.multiplier + this.increment) % this.modulus;
                return this.state / this.modulus;
            }

            nextGaussion(quality=4) {  // Standard normal distribution
                result = 0.;
                for(var i=0;i<quality;i++)
                    result += this.next();
                return (result-quality*0.5)/Math.sqrt(quality/12.);
            }
        }

        function construct_directed_graph_with_code(code, seed=0) {
            const rng = new RandomGenerator(seed)
            const get_random_point = () => [rng.nextGaussion(), rng.nextGaussion()];
            var graph = [];
            for (const [state, action] of Object.entries(code)) {
                graph.push([
                    state,  // State
                    get_random_point(),  // Position
                    true,  // Visibility
                    []  // Connections: [target_vertex_index, edge_name, prefered_length, offset_for_multiple_edges]
                ]);  // Add every state as a node in graph
            }

            var i;
            Object.keys(code).forEach(state => {  // Traversal all states
                i = graph.findIndex(e => e[0] == state);
                const vertex = graph[i];
                for (let [input, action] of Object.entries(code[state])) {  // Traversal all actions
                    if (input == NOT_VALID)
                        input = '*';
                    let [output, direction, nextState] = action;
                    if (output == NOT_VALID)
                        output = '*';
                    if (direction == NOT_VALID)
                        direction = '*';
                    const edge_name = (input == "" ? '""': input) + (output != N ? '→'+ (output == "" ? '""': output): "") + ', ' + direction;
                    if(nextState == state) {  // Connect to self
                        graph.push(["self-connection", get_random_point(), false, i]);  // Add the new node for displaying a self-connection
                        vertex[3].push([graph.length - 1, edge_name , self_connection_default_length, undefined]);  // Add a connection
                    }
                    else {  // Connection to another vertex
                        var j = graph.findIndex(e => e[0] == nextState);
                        if(j == -1) {  // This is a connection to a new node.
                            if (nextState == 'end')
                                nextState = "end_from_" + i;
                            if (nextState == 'error')
                                nextState = "error_from_" + i;
                            graph.push([
                                nextState,
                                get_random_point(),
                                true,
                                []
                            ]);  // Add the new node.
                            j = graph.length - 1;
                        }

                        // Calaulate offset for displaying multiple edges.
                        var offset = 0.5;
                        vertex[3].forEach(connection => {
                            if(connection[0] == j)  // Found multiple edge of same direction
                            {
                                offset = Math.min(offset, connection[3]);
                                connection[3] += 0.5;
                            }
                        });
                        const nextStateVertex = graph[j];
                        if(nextStateVertex[0]=='self-connection')
                            return;
                        nextStateVertex[3].forEach(connection => {
                            if(connection[0] == i) {  // Found multiple edge of opposite direction
                                offset = Math.min(offset, -connection[3]);
                                connection[3] -= 0.5;
                            }
                        });
                        offset -= 0.5;

                        vertex[3].push([j, edge_name, connection_default_length, offset]);
                    }
                    
                }
            });

            return graph;
        }

        function vector_plus(u, v) {
            return [u[0] + v[0], u[1] + v[1]]
        }

        function vector_subtract(u, v) {
            return [u[0] - v[0], u[1] - v[1]]
        }

        function vector_length(v) {
            return Math.sqrt(v[0] * v[0] + v[1] * v[1]);
        }

        function vector_scale(k, v) {
            return [k * v[0], k * v[1]];
        }

        function vector_rotate(v, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return [v[0] * cos - v[1] * sin, v[0] * sin + v[1] * cos];
        }

        function generate_arrow_head_svg(top, direction) {
            const arrow_head_root = vector_subtract(top, vector_scale(arrow_head_length, direction));
            return '<polygon points="'
                + (arrow_head_root[0] + direction[1] * arrow_head_width*0.5) + ',' + (arrow_head_root[1] - direction[0]*arrow_head_width*0.5) + ' '
                + top[0] + ',' + top[1] + ' '
                + (arrow_head_root[0] - direction[1] * arrow_head_width*0.5) + ',' + (arrow_head_root[1] + direction[0]*arrow_head_width*0.5) + '" fill="black"/>';
        }

        function generate_arrow_svg(a, b) {
            var s = '<line x1="' + a[0] + '" y1="'+a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="black" stroke-width="1"/>';

            const v = vector_subtract(b, a);
            const l = vector_length(v);
            if(l>=arrow_head_length)
            {
                const v_normalized = vector_scale(1./l, v);
                s += generate_arrow_head_svg(b, v_normalized);
            }

            return s;
        }

        function generate_connections_svg(frame, graph) {
            var s = "";

            graph.forEach(node => {
                if(node[0]=='self-connection')
                    return;
                const a = vector_plus([frame.x, frame.y], vector_scale(frame.factor, node[1]));
                node[3].forEach(connection => {
                    const target_node = graph[connection[0]];
                    const b = vector_plus([frame.x, frame.y], vector_scale(frame.factor, target_node[1]));
                    const name = connection[1];
                    const v = vector_subtract(b, a);
                    const l = vector_length(v);
                    const v_normalized = vector_scale(1./l, v);
                    const normal = [-v_normalized[1], v_normalized[0]];
                    const c = vector_scale(vertex_r, v_normalized);
                    if(target_node[0]=="self-connection")  // Self-connection
                    {
                        const c1 = vector_rotate(c, self_connection_angle*0.5);
                        const c2 = vector_rotate(c, -self_connection_angle*0.5);
                        const c3 = vector_scale(l/vertex_r, c1);
                        const c4 = vector_scale(l/vertex_r, c2);
                        const p1 = vector_plus(a, c1);
                        const p2 = vector_plus(a, c2);
                        const p3 = vector_plus(a, c3);
                        const p4 = vector_plus(a, c4);
                        const text_location = vector_plus(a, vector_scale(self_connection_text_distance_factor, v));
                        s += '<path d="M '+p1[0]+' '+p1[1]+' C '+p3[0]+' '+p3[1]+' '+p4[0]+' '+p4[1]+' '+p2[0]+' '+p2[1]+'" stroke="black" stroke-width="1" fill="none"/>'
                            +generate_arrow_head_svg(p2, vector_scale(-1./vertex_r, c2))
                            +'<text x="'+(text_location[0]-3)+'" y="'+(text_location[1]+4)+'" fill="black" style="font-size:12px">'+name+'</text>';
                    }
                    else {  // Normal connection
                        if(l>vertex_r*2) {
                            const offset = connection[3];
                            const l_cramp = Math.min(multiple_edges_shape_param2, l);
                            const c1 = vector_rotate(c, multiple_edges_gap_angle*offset*0.5);
                            const c2 = vector_rotate(c, -multiple_edges_gap_angle*offset*0.5);
                            const p1 = vector_plus(a, c1);
                            const p2 = vector_subtract(b, c2);
                            const p3 = vector_plus(p1, vector_scale(multiple_edges_shape_param1*l_cramp/vertex_r, c1));
                            const p4 = vector_subtract(p2, vector_scale(multiple_edges_shape_param1*l_cramp/vertex_r, c2));
                            const text_location = vector_plus(vector_scale(0.5, vector_plus(p3, p4)), vector_scale(connection_text_offset*Math.sign(offset+0.1), normal));
                            // s += generate_arrow_svg(vector_plus(a, c), vector_subtract(b, c))
                            //     +'<text x="'+(text_location[0]-3)+'" y="'+(text_location[1]+4)+'" fill="black" style="font-size:12px">'+name+'</text>';
                            s += '<path d="M '+p1[0]+' '+p1[1]+' C '+p3[0]+' '+p3[1]+' '+p4[0]+' '+p4[1]+' '+p2[0]+' '+p2[1]+'" stroke="black" stroke-width="1" fill="none"/>'
                                +generate_arrow_head_svg(p2, vector_scale(1./vertex_r, c2))
                                +'<text x="'+(text_location[0]-3)+'" y="'+(text_location[1]+4)+'" fill="black" style="font-size:12px">'+name+'</text>';
                        }
                    }
                });
            });

            return s;
        }

        function generate_vertices_svg(frame, graph) {
            var s = '<g fill="white">';

            graph.forEach(node => {
                if(node[2]) {
                    const p = vector_plus([frame.x, frame.y], vector_scale(frame.factor, node[1]));
                    let node_name = node[0];
                    if (node_name.startsWith('end'))
                        node_name = 'end';
                    else if (node_name.startsWith('error'))
                        node_name = 'error';
                    s += '<circle cx="'+p[0]+'" cy="' + p[1] + '" r="' + vertex_r + '" fill="' + (node_name == 'start' || node_name == 'end' || node_name == 'error' ? 'yellow' : 'white') + '" />'  // Disk
                        + '<text x="' + (p[0]-3) + '" y="' + (p[1] + 4) + '" fill="black" style="font-size:12px">' + (node[4] || "") + '</text>'  // Test in the disk
                        + '<text x="' + (p[0]+vertex_name_text_offset[0] - 3) + '" y="' + (p[1] + vertex_name_text_offset[1] + 4) + '" fill="black" style="font-size:12px">' + node_name + '</text>';  // Name outside the disk
                }
            });

            s += '</g>';

            return s;
        }

        function generate_graph_view_content(graph) {
            var s = "";

            s += generate_connections_svg(frame, graph);
            s += generate_vertices_svg(frame, graph);

            return s;
        }

        var graph = construct_directed_graph_with_code(code);
        graph_view.innerHTML = generate_graph_view_content(graph);

        function graph_evolve() {
            // Vertices repeling
            for(var i = 0; i < graph.length; i++)
                for(var j = 0; j < i; j++) {
                    const v = vector_subtract(graph[j][1], graph[i][1]);
                    const d = vector_length(v);
                    if(d<vertex_prefered_distance) {
                        const force = vector_scale((1-d/vertex_prefered_distance)*vertex_repel_strength/d, v);
                        graph[j][1] = vector_plus(graph[j][1], force);
                        graph[i][1] = vector_subtract(graph[i][1], force);
                    }
                }

            // Connections length preserving
            graph.forEach(node1 => {
                if(node1[0] == "self-connection")
                    return;
                node1[3].forEach(connection => {
                    const node2 = graph[connection[0]];
                    const prefered_length = connection[2];
                    const v = vector_subtract(node2[1], node1[1]);
                    const d = vector_length(v);
                    const force = vector_scale((1-d/prefered_length)*connection_length_preserve_strength/d, v);
                    node2[1] = vector_plus(node2[1], force);
                    node1[1] = vector_subtract(node1[1], force);
                });
            });
        }

        function update_graph_view() {
            graph_evolve();
            graph_view.innerHTML = generate_graph_view_content(graph);
            
            requestAnimationFrame(update_graph_view);  // 由运行环境决定下次执行的时间（通常与画面刷新率保持一致）
        }

        update_graph_view();

        function toArray(list) {  // Converts list to array. Also can be used to clone an array.
            a = new Array(list.length);
            for(var i=0;i<list.length;i++)
                a[i] = list[i];
            return a;
        }

        function run_turing_machine(code, tape, max_steps, detailed_output) {  // 运行图灵机
            var step = 0;
            var position = 0;
            var state = "start";
            const history = [[step, position, undefined, state, toArray(tape)]];  // 步数, 位置, 上一个状态, 当前状态, 纸带

            tape = toArray(tape);  // Clone the tape, to avoid changing the original tape.
            while(state != "end" && state != "error") {
                var need_record = detailed_output;
                step ++;
                if(step > max_steps)
                    break;

                const state_0 = state;
                const actionDict = code[state];
                if(actionDict == undefined) {
                    state = "error";
                    break;
                }

                const action = actionDict[tape[position]];
                if (action == undefined)
                    action = actionDict[OTHER];
                if (action == undefined) {
                    state = "error";
                    break;
                }
                state = action[2];
                if (action[0] == NOT_VALID) {
                    state = "error";
                    break;
                }
                if (action[0] != N) {
                    tape[position] = action[0];
                    need_record = true;
                }

                if(need_record) {
                    history.push([step, position, state_0, state, toArray(tape)]);
                }

                if (action[1] == NOT_VALID) {
                    state = "error";
                    break;
                }
                if(action[1]=="R")
                    position ++;
                else if (action[1]=="L")
                    position --;
            }

            return history;
        }

        var tape = toArray(["", "1", "0", "1", "1", "1", "", "1", "1", "0", "", "", "", "", "", "", "", "", "", "", "", "", ""]);  // 正确答案：11余101
        // var tape = toArray(["", "1", "0", "1", "", "1", "1", "", "", "", "", "", "", "", "", "", "", ""]);  // 正确答案：1余10
        // var tape = toArray(["", "1", "1", "", "1", "0", "", "", "", "", "", "", "", "", "", "", ""]);  // 正确答案：1余1
        // var tape = toArray(["", "1", "", "1", "0", "", "", "", "", "", "", "", "", "", "", ""]);  // 正确答案：0余1

        var result = run_turing_machine(code, tape, 3000, false);
        // console.log(result);

        function generate_history_table_row(record) {
            var s = "";

            s += '<td style="border:none; padding-right:1em; text-align:right">'+record[0]+'</td>';

            position = 0;
            record[4].forEach(e => {
                var style = "border:1px solid black;";

                style_list = result_table_style[e];
                if(style_list!=undefined) {
                    var background = style_list[0];
                    if(background!=undefined)
                        style += "background-color: " + background + "; ";
                    var foreground = style_list[1];
                    if(foreground!=undefined)
                        style += "color: " + foreground + "; ";
                }

                if(position==record[1])
                    style += "border-top: 4px solid black; ";

                s += "<td" + (style=="" ? "": ' style="' + style + '"') + ">" + e + "</td>";

                position ++;
            });
            return "<tr>" + s + "</tr>";
        }

        // 用户编辑纸带初值完成回调函数
        function finishEditingTapeCallback(data) {
            console.log('回调函数被触发:', data);
            if (data.value !== tape[data.cellIndex]) {  // 有变化
                tape[data.cellIndex] = data.value;  // 更新纸带数据
                run_program();  // 重新运行程序
            }
        }

        function refresh_history_table(history_table, history) {
            var s = "";

            history.forEach(e=>{
                s += generate_history_table_row(e);
            });

            history_table.innerHTML = s;
            
            // 让第一行所有单元格可编辑
            const firstRowCells = history_table.rows[0].cells;  // 获取表格第一行的所有单元格
            for (let i = 0; i < firstRowCells.length; i++) {
                if (i == 0)
                    continue;  // 跳过第一列（步数）
                const cell = firstRowCells[i];
                
                // 设置单元格为可编辑
                cell.contentEditable = true;
                
                // 添加失去焦点事件监听
                cell.addEventListener('blur', function(event) {
                    finishEditingTapeCallback({
                        cellIndex: i - 1,
                        value: cell.textContent
                    });
                });
                
                // 添加键盘事件监听（按下回车）
                cell.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();  // 防止回车产生新行
                        cell.blur();  // 主动失去焦点。这会触发上面的blur事件
                    }
                });
                
                // 保存原始内容，用于对比变化
                cell.setAttribute('data-original-content', cell.textContent);
            }

            // 鼠标悬停显示状态转移
            const rows = history_table.querySelectorAll('tr');
            rows.forEach((row, i) => {
                const record = history[i];
                row.title = `state: ${(record[2] != undefined ? record[2] + " → " : "")}${(record[3] != undefined ? record[3] : "")}`;
            });
        }

        refresh_history_table(history_table, result);

        function refresh_graph_embedding() {
            // TODO: real-time compile
            code_text = editor_code.getDoc().getValue();
            result_table_style_text = editor_style.getDoc().getValue();
            code = parseCode(code_text);
            result_table_style = eval("[" + result_table_style_text + "]")[0];

            graph = construct_directed_graph_with_code(code);
        }

        function run_program() {
            // TODO: real-time compile
            code_text = editor_code.getDoc().getValue();
            result_table_style_text = editor_style.getDoc().getValue();
            code = parseCode(code_text);
            result_table_style = eval("[" + result_table_style_text + "]")[0];

            result = run_turing_machine(code, tape, max_steps_input.value, false);
            refresh_history_table(history_table, result);
        }

        // Add event listeners

        graph_view.addEventListener("mousedown", e => {  // Middle button dragging for moving the graph
            if(e.button == 1) {
                var last_position = [e.offsetX, e.offsetY];
                graph_view.style.cursor = "grabbing";  // Change cursor to grabbing
                var on_mouse_move = e => {
                    const new_position = [e.offsetX, e.offsetY];
                    frame.x += new_position[0] - last_position[0];
                    frame.y += new_position[1] - last_position[1];
                    last_position = new_position;
                };
                var on_mouse_up = e => {
                    window.removeEventListener("mousemove", on_mouse_move);  // Remove listeners after dragging is done
                    window.removeEventListener("mouseup", on_mouse_up);
                    graph_view.style.cursor = "default";  // Change cursor back to default
                };
                window.addEventListener("mousemove", on_mouse_move);
                window.addEventListener("mouseup", on_mouse_up);
            }
        });

        graph_view.addEventListener("wheel", e => {  // Wheel scrolling for zooming the graph
            const zoom_factor = 1.1;
            if(e.deltaY < 0) {  // Zoom in
                frame.factor *= zoom_factor;
                frame.x = e.offsetX + zoom_factor * (frame.x - e.offsetX);
                frame.y = e.offsetY + zoom_factor * (frame.y - e.offsetY);
            }
            else {  // Zoom out
                frame.factor /= zoom_factor;
                frame.x = e.offsetX + (1 / zoom_factor) * (frame.x - e.offsetX);
                frame.y = e.offsetY + (1 / zoom_factor) * (frame.y - e.offsetY);
            }
        });
    </script>
